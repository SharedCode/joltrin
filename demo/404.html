<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
  <script>
    // iPads and phones can keep the portrait layout width after a rotation until a reload.
    // Re-reading the viewport tag on rotation makes the browser lay the page out again.
    (function () {
      var m = document.querySelector('meta[name="viewport"]');
      if (!m) return;
      var c = m.getAttribute('content');
      function relayout() { m.setAttribute('content', c + ', minimum-scale=1'); setTimeout(function () { m.setAttribute('content', c); }, 60); }
      window.addEventListener('orientationchange', relayout);
      if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', relayout);
    })();
  </script>
  <title>Redirecting to Joltrin...</title>
  <script>
    (function() {
      var path = window.location.pathname.toLowerCase();
      var isGithubPages = window.location.hostname === 'github.io' || window.location.hostname.endsWith('.github.io');
      var prefix = isGithubPages ? '/joltrin' : '';
      if (path.includes('/arena')) {
        window.location.replace(prefix + '/arena/');
      } else if (path.includes('/agents')) {
        window.location.replace(prefix + '/agents/');
      } else {
        window.location.replace(prefix + '/');
      }
    })();
  </script>
</head>
<body style="background:#070a13; color:#94a3b8; font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; text-align:center; padding-top:20vh;">
  <p>Redirecting to <a id="home-link" href="/joltrin/" style="color:#00f2fe; text-decoration:none; font-weight:600;">Joltrin</a>...</p>
  <script>
    if (!(window.location.hostname === 'github.io' || window.location.hostname.endsWith('.github.io'))) {
      document.getElementById('home-link').setAttribute('href', '/');
    }
  </script>
</body>
</html>
