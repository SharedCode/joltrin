<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Joltrin...</title>
  <script>
    (function() {
      var path = window.location.pathname.toLowerCase();
      var isGithubPages = window.location.hostname.endsWith('github.io');
      var prefix = isGithubPages ? '/joltrin' : '';
      if (path.includes('/arena')) {
        window.location.replace(prefix + '/arena/');
      } else if (path.includes('/agents')) {
        window.location.replace(prefix + '/agents/');
      } else {
        window.location.replace(prefix + '/');
      }
    })();
  </script>
</head>
<body style="background:#070a13; color:#94a3b8; font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; text-align:center; padding-top:20vh;">
  <p>Redirecting to <a id="home-link" href="/joltrin/" style="color:#00f2fe; text-decoration:none; font-weight:600;">Joltrin</a>...</p>
  <script>
    if (!window.location.hostname.endsWith('github.io')) {
      document.getElementById('home-link').setAttribute('href', '/');
    }
  </script>
</body>
</html>
