                const safeSpaceName = window.escapeHTML(spaceName);
                const safeCategoryId = window.escapeHTML(categoryId || '');
                const safeCategoryName = window.escapeHTML(categoryName || '').replace(/'/g, "\\'");
                if (totalPages > 1) {
                        paginationHtml += `<div style="display: flex; gap: 10px; margin-top: 20px; align-items: center; justify-content: center; width: 100%; grid-column: 1 / -1; padding: 10px; box-sizing: border-box; border-top: 1px solid var(--border-color);">`;
                
                        // Prev
                        if (currentPage > 1) {
                                paginationHtml += `<button onclick="window.fetchItemsForCategory('${safeSpaceName}', '${safeCategoryId}', '${safeCategoryName}', null, null, ${offset - limit}, ${limit})" style="padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--button-bg); color: var(--text-color); cursor: pointer;">Prev</button>`;
                        } else {
                                paginationHtml += `<button disabled style="padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--secondary-bg); color: var(--text-muted); cursor: not-allowed; opacity: 0.5;">Prev</button>`;
                        }
                	let startPage = Math.max(1, currentPage - 2);
                	let endPage = Math.min(totalPages, currentPage + 2);
                	
                	if (startPage > 1) {
                		paginationHtml += `<button onclick="window.fetchItemsForCategory('${safeSpaceName}', '${safeCategoryId}', '${safeCategoryName}', null, null, 0, ${limit})" style="padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--button-bg); color: var(--text-color); cursor: pointer;">1</button>`;
                		if (startPage > 2) paginationHtml += `<span style="padding: 0 5px; color: var(--text-muted);">...</span>`;
                	}
                	
                	for (let i = startPage; i <= endPage; i++) {
                		const isCurrent = i === currentPage;
                		const pageOffset = (i - 1) * limit;
                		const style = isCurrent 
                			? `padding: 5px 10px; border-radius: 4px; border: 1px solid #5b6ed1; background: #5b6ed1; color: white; font-weight: bold; cursor: default;`
                			: `padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--button-bg); color: var(--text-color); cursor: pointer;`;
                			
                		if (isCurrent) {
                			paginationHtml += `<button style="${style}">${i}</button>`;
                		} else {
                			paginationHtml += `<button onclick="window.fetchItemsForCategory('${safeSpaceName}', '${safeCategoryId}', '${safeCategoryName}', null, null, ${pageOffset}, ${limit})" style="${style}">${i}</button>`;
                		}
                	}
                	
                	if (endPage < totalPages) {
                		if (endPage < totalPages - 1) paginationHtml += `<span style="padding: 0 5px; color: var(--text-muted);">...</span>`;
                		paginationHtml += `<button onclick="window.fetchItemsForCategory('${safeSpaceName}', '${safeCategoryId}', '${safeCategoryName}', null, null, ${(totalPages - 1) * limit}, ${limit})" style="padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--button-bg); color: var(--text-color); cursor: pointer;">${totalPages}</button>`;
                	}

                	// Next
			let lastRenderedCatId = "";
			let lastRenderedItemId = "";
			if (items && items.length > 0) {
				lastRenderedCatId = items[items.length - 1].category || "";
				if (!lastRenderedCatId) lastRenderedCatId = items[items.length - 1].Category || ""; // Fallback mapping
				lastRenderedItemId = items[items.length - 1].id || "";
				if (!lastRenderedItemId) lastRenderedItemId = items[items.length - 1].ID || ""; // Fallback mapping
			}

			if (currentPage < totalPages) {
				paginationHtml += `<button onclick="window.fetchItemsForCategory('${safeSpaceName}', '${safeCategoryId}', '${safeCategoryName}', null, null, ${offset + limit}, ${limit}, '${window.escapeHTML(lastRenderedCatId).replace(/'/g, "\\'")}', '${window.escapeHTML(lastRenderedItemId).replace(/'/g, "\\'")}')" style="padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--button-bg); color: var(--text-color); cursor: pointer;">Next</button>`;
                		paginationHtml += `<button disabled style="padding: 5px 10px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--secondary-bg); color: var(--text-muted); cursor: not-allowed; opacity: 0.5;">Next</button>`;
                	}

                	paginationHtml += `</div>`;
                }
                
                contentHtml += paginationHtml;
                tg.innerHTML = contentHtml;

            } catch (err) {
                console.error(err);
                tg.innerHTML = "<div style='padding: 15px; color: red;'>Error fetching items: " + window.escapeHTML(err.message) + "</div>";
            }
        };

        const allItem = document.querySelector('#sidebar-view-all-items');
        window.fetchItemsForCategory(name, '', 'All Items', allItem);

    } catch (err) {
        console.error(err);
        grid.innerHTML = "<div style='padding: 15px;'>Error fetching Categories: " + err.message + "</div>";
    }
}

async function selectStore(name, element, force = false) {
        if (currentStore === name && !force) return;

        // Close detail panel as it may be showing data from previous store
        if (!await closeDetail()) return;

        currentStore = name;
        columnWidths = []; // Reset column widths
        loadColumnPreferences(); // Load saved column settings
        columnsInitialized = false;

        // Restore standard UI if coming from Knowledge Page
        const kp = document.getElementById('space-page');
        if (kp) kp.style.display = 'none';
        const titleElemCont = document.getElementById('current-store-title');
        if (titleElemCont && titleElemCont.parentElement) {
            titleElemCont.parentElement.style.display = 'flex';
        }
        const elementsToRestore = [
            'btn-code-store', 'btn-edit-store', 'btn-view-store', 'btn-edit-cel', 'btn-delete-store',
            'toolbar', 'pagination-top', 'data-grid', 'pagination', 'detail-resizer'
        ];
        elementsToRestore.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = ''; // revert inline hide
        });
        
        // Highlight active
        document.querySelectorAll('#sidebar li').forEach(el => el.classList.remove('active'));
        element.classList.add('active');

        // Show Delete Button
        const deleteBtn = document.getElementById('btn-delete-store');
        
        // Hardening: Disable delete for System DB and protected stores
        const dbObj = availableDatabases.find(d => d.name === currentDatabase);
        const isSystem = (dbObj && dbObj.is_system) || currentDatabase === 'system' || currentDatabase === SYSTEM_DB_NAME;
        const isProtectedStore = (name === 'llm_feedback' || name === 'memory');
        
        if (isSystem || isProtectedStore) {
            deleteBtn.style.display = 'none';
        } else {
            deleteBtn.style.display = 'inline-block';
        }
        
        deleteBtn.title = `Delete store '${name}'`;

        // Show Code Button
        const codeBtn = document.getElementById('btn-code-store');
        codeBtn.style.display = 'inline-block';
        codeBtn.title = `Generate Code for '${name}'`;

        // Show Edit Store Button
        const editBtn = document.getElementById('btn-edit-store');
        editBtn.style.display = 'none';

        // Hide Space-specific buttons
        closeUIModal('btn-edit-kb');
        closeUIModal('btn-export-kb');
        closeUIModal('btn-import-kb');
        closeUIModal('btn-delete-kb');
        closeUIModal('btn-add-kb-category');

        // Show View Store Button
        const viewBtn = document.getElementById('btn-view-store');
        viewBtn.style.display = 'none';

        // Show Edit CEL Button
        const celBtn = document.getElementById('btn-edit-cel');
        celBtn.style.display = 'none'; // Hidden in favor of Edit Store
        // celBtn.style.display = 'inline-block';
        // celBtn.title = `Edit '${name}' CEL expression`;

        // Fetch Store Info
        apiCall(`/api/store/info?database=${encodeURIComponent(currentDatabase)}&name=${encodeURIComponent(name)}`)
            .then(info => {
                currentStoreInfo = info;

                // Toggle Edit/View buttons based on count
                // NOTE: We now use the Edit button for ALL stores (populated or empty).
                // The Edit modal handles read-only fields for populated stores.
                // However, for System DB, we force Read-Only View.
                if (isSystem) {
                    editBtn.style.display = 'none';
                    viewBtn.style.display = 'inline-block';
                    viewBtn.title = `View Store Metadata for '${name}' (Read-Only)`;
                } else {
                    editBtn.style.display = 'inline-block';
                    editBtn.title = `Edit Store Metadata for '${name}'`;
                    viewBtn.style.display = 'none';
                }
                
                /*
                if (info.count > 0) {
                    viewBtn.style.display = 'inline-block';
                    viewBtn.title = `View Store Details for '${name}'`;
                    editBtn.style.display = 'none';
                } else {
                    editBtn.style.display = 'inline-block';
                    editBtn.title = `Edit Store '${name}'`;
                    viewBtn.style.display = 'none';
                }
                */

                // Use name for display, description for tooltip
                let displayTitle = info.name;
                if (displayTitle) {
                    displayTitle = displayTitle.charAt(0).toUpperCase() + displayTitle.slice(1);
                }
                const titleElem = document.getElementById('current-store-title');
                titleElem.textContent = displayTitle;
                if (info.description) {
                    titleElem.title = info.description;
                } else {
                    titleElem.removeAttribute('title');
                }

                buildSearchUI(info);
                loadItems('first');
            });
    }

    function deleteStore() {
        if (!currentStore) return;
        
        promptAsync(`Please type the store name '${currentStore}' to confirm deletion:`, "Delete Store")
        .then(name => {
            if (name === null) return; // User cancelled prompt
            
            if (name.trim().toLowerCase() !== currentStore.toLowerCase()) {
                showAlert("Store name does not match. Deletion cancelled.");
                return;
            }

        apiCall('/api/store/delete', 'POST', {
            database: currentDatabase,
            store: currentStore
        })
        .then(data => {
            if (data.status === 'ok') {
                showAlert("Store deleted successfully.");
                currentStore = null;
                document.getElementById('current-store-title').textContent = "Select Store or Space";
                
                // Hide all store-specific buttons
                closeUIModal('btn-delete-store');
                closeUIModal('btn-code-store');
                closeUIModal('btn-edit-store');
                closeUIModal('btn-view-store');
                closeUIModal('btn-edit-cel');
                closeUIModal('btn-edit-kb');
                closeUIModal('btn-export-kb');
                closeUIModal('btn-import-kb');
                closeUIModal('btn-delete-kb');
                closeUIModal('btn-add-kb-category');

                document.getElementById('data-grid').innerHTML = '';
                closeUIModal('toolbar');
                // Refresh list
                selectDatabase(currentDatabase, true);
            } else {
                showAlert("Error: " + (data.error || "Unknown error"));
            }
        });
        });
    }

    function deleteSpace() {
        if (!currentStore) return;
        
        let spaceName = currentStore;
        if (spaceName.endsWith("/data")) {
            spaceName = spaceName.slice(0, -5);
        }

        promptAsync(`Please type the space name '${spaceName}' to confirm deletion:`, "Delete Space")
        .then(name => {
            if (name === null) return; // cancelled
            
            if (name.trim().toLowerCase() !== spaceName.toLowerCase()) {
                showAlert("Space name does not match. Deletion cancelled.");
                return;
            }

            apiCall('/api/spaces/delete', 'POST', {
                database: currentDatabase,
                space: spaceName

function isLocalEmbedderProvider(providerName) {
    const normalized = (providerName || '').toLowerCase();
    return normalized === 'ollama' || normalized === 'kelindar' || normalized === 'local';
}

window.resolveSpaceEmbedderAuth = async function(config) {
    if (!config || !config.embedder) return null; // No specific embedder requested, use system

    let provider = config.embedder;
    let model = "";
    if (provider.includes(":")) {
        let parts = provider.split(":");
        provider = parts[0];
        model = parts[1] || "";
    }

    if (isLocalEmbedderProvider(provider)) {
        return {
            'X-Embedder-Provider': provider,
            'X-Embedder-API-Key': '',
            'X-Embedder-URL': '',
            'X-Embedder-Model': model || ''
        };
    }

    // Checking if system config already fulfills it
    const sysLStr = localStorage.getItem('sop_ai_config');
    if (sysLStr) {
        try {
            const sysConfig = JSON.parse(sysLStr);
            if (sysConfig.embedder_provider === provider) {
                return null; // System config currently covers this provider perfectly
            }
        } catch(e) {}
    }

    // Check custom provider keys keychain
    let keychainStr = localStorage.getItem('sop_provider_keys');
    let keychain = {};
    if (keychainStr) {
        try {
            keychain = JSON.parse(keychainStr);
        } catch(e) {}
    }

    // If keychain has valid credentials for this provider, return them as override headers immediately
    if (keychain[provider] && (keychain[provider].api_key || provider === 'ollama')) {
        let headers = {
            'X-Embedder-Provider': provider,
            'X-Embedder-API-Key': keychain[provider].api_key || '',
            'X-Embedder-URL': keychain[provider].url || '',
            'X-Embedder-Model': model || ''
        };
        return headers;
    }

    // JIT: Not found! We must resolve it interactively.
    return new Promise((resolve, reject) => {
        document.getElementById('missing-provider-name').textContent = provider.toUpperCase();
        document.getElementById('missing-provider-key').value = '';
        document.getElementById('missing-provider-url').value = '';
        document.getElementById('missing-provider-modal').style.display = 'flex';

        document.getElementById('missing-provider-save-btn').onclick = () => {
            let key = document.getElementById('missing-provider-key').value.trim();
            let url = document.getElementById('missing-provider-url').value.trim();
            
            if (!key && provider !== 'ollama') {
                alert(`An API Key is required for ${provider}.`);
                return;
            }

            keychain[provider] = { api_key: key, url: url };
            localStorage.setItem('sop_provider_keys', JSON.stringify(keychain));
            document.getElementById('missing-provider-modal').style.display = 'none';

            let headers = {
                'X-Embedder-Provider': provider,
                'X-Embedder-API-Key': key,
                'X-Embedder-URL': url,
                'X-Embedder-Model': model
            };
            resolve(headers);
        };

        window.closeMissingProviderModal = function() {
            document.getElementById('missing-provider-modal').style.display = 'none';
            reject(new Error("Provider authentication cancelled by user."));
        };
    });
};

window.vectorizeSpace = async function(spaceName, skipDimensionCheck = false) {
    let cleanName = spaceName ? spaceName : (currentStore ? currentStore.replace('/data', '') : "");
    if (!cleanName) return;

    let overrideHeaders = null;
    try {
        const res = await authFetch(`/api/spaces/config/get?database=${encodeURIComponent(currentDatabase)}&name=${encodeURIComponent(cleanName)}&_t=${new Date().getTime()}`);
        if (res.ok) {
            const config = await res.json();
            
            // Perform JIT Authentication Resolution
            try {
                overrideHeaders = await window.resolveSpaceEmbedderAuth(config);
            } catch(authErr) {
                showAlert(authErr.message);
                return; // User cancelled JIT
            }

            if (!skipDimensionCheck && config.embedder && config.space_embedder_dimension > 0 && config.space_embedder_dimension !== config.system_embedder_dimension) {
                if(confirm(`The current System Embedder has a different dimension (${config.system_embedder_dimension}) than your Space's specifically configured Embedder (${config.space_embedder_dimension}). Vectorizing partial items may result in dimension mismatch errors.\n\nWould you like to Vectorize the ENTIRE Space now to normalize all vectors?`)) {

        if (!scopeElem) return;
        let scope = scopeElem.value;
        let url = `/api/spaces/vectorize?space=${encodeURIComponent(cleanName)}&database=${encodeURIComponent(currentDatabase)}`;
        
        let itemIds = [];
        let bodyPayload = { database: currentDatabase, space: cleanName };

        if (scope === 'current_page') {
            if (!selCatId || selCatName === 'All Items') {
                showAlert("Please select a specific category before vectorizing current page items.");
                return;
            }
            if (window._lastSpaceItems && window._lastSpaceItems.length > 0) {
                itemIds = window._lastSpaceItems.map(item => item.id);
            }
            if (itemIds.length === 0) {
                showAlert("No items to vectorize on current page.");
                return;
            }
            bodyPayload.itemIds = itemIds;
            bodyPayload.categoryId = selCatId;
        } else if (scope === 'current_category') {
            if (!selCatId || selCatName === 'All Items') {
                showAlert("No specific category selected.");
                return;
            }
            bodyPayload.categoryId = selCatId;
        }
        
        try {
            const result = await apiCall(url, 'POST', bodyPayload, overrideHeaders);
            if (result.task_id) {
                // Poll using global function
                pollLongRunningTask(
                    result.task_id, 
                    "Vectorizing Space", 
                    `Vectorizing Space: ${cleanName}`, 
                    "Vectorize"
                ).then(async () => {
                    showAlert(`Space '${cleanName}' vectorization completed successfully!`);
                    // Refresh current view (categories and items) to show updated vectors
                    await refreshCategoryCache(cleanName);
                    if (window._lastFetchItemsArgs) {
                        window.fetchItemsForCategory(
                            window._lastFetchItemsArgs.spaceName, 
                            window._lastFetchItemsArgs.categoryId, 
                            window._lastFetchItemsArgs.categoryName, 
                            window._lastFetchItemsArgs.liElement, 
                            window._lastFetchItemsArgs.catObj,
                            window._lastFetchItemsArgs.offset,
                            window._lastFetchItemsArgs.limit,
                            window._lastFetchItemsArgs.lastCatId,
                            window._lastFetchItemsArgs.lastItemId
                        );
                    }
                    if (document.getElementById('edit-kb-modal') && document.getElementById('edit-kb-modal').style.display === 'flex') {
                        if (document.getElementById('edit-kb-name').value === cleanName) {
                            showEditKB(cleanName, false);
                        }
                    }
                }).catch(err => {
                    showAlert(`Vectorization failed: ${err.message}`);
                });
            } else {
                showAlert(`Space '${cleanName}' vectorization started successfully!`);
            }
        } catch (err) {
            showAlert("Failed to start vectorization: " + err.message);
        }
};
};

window.closeEditKBModal = function() {
    closeUIModal('edit-kb-modal');
    const nameEl = document.getElementById('edit-kb-name');
    if (nameEl) nameEl.value = '';
}

window.showEditKB = async function() {
    if (!currentStore) return;
    const baseName = currentStore.replace('/data', '');

    // Fetch config first so the server-owned read-only flag can be honored.
    let config = null;
    try {
        const res = await authFetch(`/api/spaces/config/get?database=${encodeURIComponent(currentDatabase)}&name=${encodeURIComponent(baseName)}&_=${Date.now()}`);
        if (res.ok) {
            config = await res.json();
        }
    } catch (e) {
        console.error("Error fetching space config:", e);
    }

    const isReadOnly = isSpaceReadOnly(baseName, currentDatabase) || !!(config && config.is_read_only);

    const modal = document.getElementById('edit-kb-modal');
    const titleSpan = document.getElementById('edit-kb-modal-title');
    if (titleSpan) {
        titleSpan.textContent = isReadOnly ? 'View Space Configuration' : 'Edit Space Configuration';
    }
    
    // Load config values into modal fields
    document.getElementById('edit-kb-name').value = baseName;
    document.getElementById('edit-kb-name').disabled = true; // Always disable name in edit mode

    // Pre-fill
    if (config) {
        let warningEl = document.getElementById('edit-kb-vector-warning');
        if (warningEl) {
            // Track if it hasn't been vectorized or if it was modified since last vectorization
            let needsVectorization = !config.last_vectorized || (config.last_modified && config.last_vectorized < config.last_modified);
            warningEl.style.display = needsVectorization ? 'flex' : 'none';
        }

        if(document.getElementById('edit-kb-sysprompt')) document.getElementById('edit-kb-sysprompt').value = config.system_prompt || '';
        if(document.getElementById('edit-kb-is-persona')) document.getElementById('edit-kb-is-persona').checked = !!config.is_persona;
        
        // Trigger display logic for the prompt container based on persona checked
        if(document.getElementById('edit-kb-sysprompt-container')) {
             document.getElementById('edit-kb-sysprompt-container').style.display = config.is_persona ? 'block' : 'none';
        }

        if(document.getElementById('edit-kb-embedder')) {
             const pinnedEmbedder = 'kelindar:nomic-embed-text-v1.5-q8_0';
             const effectiveEmbedder = isPinnedInternalSpace(baseName) ? pinnedEmbedder : (config.embedder || '');
             document.getElementById('edit-kb-embedder').value = effectiveEmbedder;
        }
        if(document.getElementById('edit-kb-domain-reference')) {
             const domainRef = Array.isArray(config.domain_reference) && config.domain_reference.length > 0
                 ? JSON.stringify(config.domain_reference)
                 : '';
             document.getElementById('edit-kb-domain-reference').value = domainRef;
        }
        if(document.getElementById('edit-kb-dimension')) {
             document.getElementById('edit-kb-dimension').value = config.space_embedder_dimension || config.system_embedder_dimension || '';
        }
        if(document.getElementById('edit-kb-public')) document.getElementById('edit-kb-public').checked = !!config.is_public;
    } else {
        // Fallback clear
        if(document.getElementById('edit-kb-sysprompt')) document.getElementById('edit-kb-sysprompt').value = '';
        if(document.getElementById('edit-kb-is-persona')) document.getElementById('edit-kb-is-persona').checked = false;
        if(document.getElementById('edit-kb-domain-reference')) document.getElementById('edit-kb-domain-reference').value = '';
        if(document.getElementById('edit-kb-sysprompt-container')) document.getElementById('edit-kb-sysprompt-container').style.display = 'none';
    }

    // Apply read-only locks
    const allInputs = modal.querySelectorAll('input:not(#edit-kb-name), select, textarea:not(#edit-kb-domain-reference)');
    allInputs.forEach(el => el.disabled = isReadOnly);

    const saveBtn = document.getElementById('edit-kb-save-btn');
    if (saveBtn) {
        saveBtn.style.display = isReadOnly ? 'none' : 'inline-block';
        if (!isReadOnly) {
            saveBtn.onclick = async () => {
                const payload = {
                    database: currentDatabase,
                    name: baseName,
                    embedder: document.getElementById('edit-kb-embedder') ? document.getElementById('edit-kb-embedder').value : '',
                    is_persona: document.getElementById('edit-kb-is-persona') ? document.getElementById('edit-kb-is-persona').checked : false,
                    is_public: document.getElementById('edit-kb-public') ? document.getElementById('edit-kb-public').checked : false,
                    system_prompt: document.getElementById('edit-kb-sysprompt') ? document.getElementById('edit-kb-sysprompt').value : ''
                };
                
                if (window.resolveSpaceEmbedderAuth) {
                    try {
                        await window.resolveSpaceEmbedderAuth({ embedder: payload.embedder });
                    } catch(e) {
                        console.log("JIT provider auth cancelled by user during Space Edit");
                        return;
                    }
                }

                try {
                    const r = await authFetch(`/api/spaces/config?database=${encodeURIComponent(currentDatabase)}&name=${encodeURIComponent(baseName)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!r.ok) {
                        const errText = await r.text();
                        let errMsg = errText;
                        try {
                            const errObj = JSON.parse(errText);
                            if (errObj && (errObj.error || errObj.message)) {
                                errMsg = errObj.error || errObj.message;
                            }
                        } catch(parseErr) { }
                        throw new Error(errMsg || 'Unknown error');
                    } else {
                        window.closeEditKBModal();
                    }
                } catch (e) {
                    showAlert('Failed to save configuration: ' + e.message);
                }
            };
        }
    }
    
    openUIModal('edit-kb-modal');
};

async function exportSpace() {
    if (!currentStore) return;
    const baseName = currentStore.replace('/data', '');
    const url = `/api/spaces/export?database=${encodeURIComponent(currentDatabase)}&name=${encodeURIComponent(baseName)}`;
    window.open(url, '_blank');
}

async function importSpace(event) {
    const file = event.target.files[0];
    if (!file || !currentStore) return;
    const baseName = currentStore.replace('/data', '');
    
    if (!confirm(`Are you sure you want to import data into the Space '${baseName}'? Existing data won't be replaced, but similar data might cause duplication.`)) {
        event.target.value = '';
        return;
    }

    const formData = new FormData();
    formData.append('file', file);

    try {
        const res = await authFetch(`/api/spaces/import?database=${encodeURIComponent(currentDatabase)}&name=${encodeURIComponent(baseName)}`, {
            method: 'POST',
            body: formData
        });
        if (res.ok) {
            alert('Import completed successfully!');
            const activeLi = document.querySelector('#sidebar li.active');
            if(activeLi) activeLi.click();
        } else {
            const err = await res.text();
            alert('Import failed: ' + err);
        }
    } catch (e) {
        alert('Network error during import: ' + e.message);
    }
    event.target.value = '';
}
