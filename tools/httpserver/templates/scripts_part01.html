<script>
    // Global context RBAC map mapping asset type to permission map.
    window.CONTEXT_RBAC = window.CONTEXT_RBAC || {};

    window.onerror = function(message, source, lineno, colno, error) {
        console.error("GLOBAL ERROR CAUGHT:", message, "at", source, ":", lineno, ":", colno);
        return false; // Let default handler run
    };

    /* --- Core Frontend Utilities --- */
    
    // Polls a long running task by ID and updates the progress modal.
    function pollLongRunningTask(taskId, titleText, initialMsg, prefixMsg, closeOnComplete = true) {
        return new Promise((resolve, reject) => {
            if (!taskId) return resolve();
            
            const modal = document.getElementById('setup-loading-modal');
            const title = document.getElementById('setup-loading-title');
            const msg = document.getElementById('setup-loading-message');
            const details = document.getElementById('setup-loading-details');
            const pb = document.getElementById('setup-progress-bar');
            
            if(modal) {
                modal.style.display = 'flex';
            }
            if(title && titleText) title.innerText = titleText;
            if(msg && initialMsg) msg.innerText = initialMsg;
            if(details) details.innerHTML = '';
            if(pb) pb.style.width = '0%';
            
            const interval = setInterval(async () => {
                try {
                    const statusRes = await authFetch(`/api/tasks/status?task_id=${taskId}`);
                    if (!statusRes.ok) throw new Error("Status check failed");
                    const statusData = await statusRes.json();
                    
                    if (statusData.status === "in_progress") {
                        if (details) {
                            let text = statusData.message || 'Processing...';
                            if (prefixMsg) {
                                text = `${prefixMsg}: ${text}`;
                            }
                            details.innerHTML = `- ${text}<br>`;
                        }
                        if (pb && statusData.progress) {
                            pb.style.width = `${Math.min(95, statusData.progress)}%`;
                        }
                    } else if (statusData.status === "completed") {
                        clearInterval(interval);
                        if(modal && closeOnComplete) modal.style.display = 'none';
                        resolve();
                    } else if (statusData.status === "error") {
                        clearInterval(interval);
                        if(modal && closeOnComplete) modal.style.display = 'none';
                        reject(new Error(statusData.error || "Unknown error"));
                    }
                } catch (e) {
                    clearInterval(interval);
                    if(modal && closeOnComplete) modal.style.display = 'none';
                    reject(e);
                }
            }, 1000);
        });
    }

    function clearStoredSessionToken() {
        localStorage.removeItem('sop_access_token');
        localStorage.removeItem('sop_refresh_token');
        localStorage.removeItem('sop_session_token');
        localStorage.removeItem('access_token');
        sessionStorage.removeItem('sop_access_token');
        sessionStorage.removeItem('sop_refresh_token');
        sessionStorage.removeItem('sop_session_token');
        sessionStorage.removeItem('access_token');
    }

    function getStoredSessionToken() {
        return localStorage.getItem('sop_access_token') ||
               localStorage.getItem('sop_session_token') ||
               localStorage.getItem('access_token') ||
               sessionStorage.getItem('sop_access_token') ||
               sessionStorage.getItem('sop_session_token') ||
               sessionStorage.getItem('access_token') || '';
    }

    function getStoredRefreshToken() {
        return localStorage.getItem('sop_refresh_token') ||
               sessionStorage.getItem('sop_refresh_token') || '';
    }

    function clearCachedAppState() {
        try {
            currentStore = null;
            currentStoreInfo = null;
            currentItemKey = null;
            currentItemValue = null;
            currentItems = [];
            window._currentKBCategories = [];
            window._lastFetchItemsArgs = null;
            localStorage.removeItem('sop_current_database');
            localStorage.removeItem('sop_current_store');

            const dataGrid = document.getElementById('data-grid');
            if (dataGrid) dataGrid.innerHTML = '';
            const storeList = document.getElementById('store-list');
            if (storeList) storeList.innerHTML = '';
            const kbList = document.getElementById('kb-list');
            if (kbList) kbList.innerHTML = '';
            const detailPanel = document.getElementById('detail-panel');
            if (detailPanel) detailPanel.style.display = 'none';
            const toolbar = document.getElementById('toolbar');
            if (toolbar) toolbar.style.display = 'none';
            const pagination = document.getElementById('pagination');
            if (pagination) pagination.style.display = 'none';
            const paginationTop = document.getElementById('pagination-top');
            if (paginationTop) paginationTop.style.display = 'none';
        } catch (err) {
            console.warn('Failed to clear cached app state', err);
        }
    }

    async function refreshSessionToken() {
        const response = await fetch('/api/auth/refresh', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' }
        });

        if (!response.ok) {
            throw new Error('Refresh failed');
        }

        const body = await response.json();
        if (!body || !body.access_token) {
            throw new Error('Refresh returned no access token');
        }

        return true;
    }

    async function authFetch(endpoint, options = {}) {
        const headers = Object.assign({}, options.headers || {});
        headers['Cache-Control'] = 'no-store';
        headers.Pragma = 'no-cache';

        const response = await fetch(endpoint, Object.assign({}, options, {
            cache: 'no-store',
            credentials: 'same-origin',
            headers
        }));
        if (!response.ok && (response.status === 401 || response.status === 403)) {
            if (response.status === 401 && !options._retry) {
                try {
                    const refreshed = await refreshSessionToken();
                    if (refreshed) {
                        const retryHeaders = Object.assign({}, options.headers || {});
                        return await fetch(endpoint, Object.assign({}, options, {
                            _retry: true,
                            headers: Object.assign({}, options.headers || {})
                        }));
                    }
                } catch (err) {
                    console.warn('Token refresh failed, forcing login', err);
                }
            }

            clearStoredSessionToken();
            clearCachedAppState();
            if (window.location.pathname !== '/login') {
                window.location.assign('/login');
            }
            throw new Error(`Auth required (${response.status})`);
        }
        return response;
    }

    function apiCallSync(endpoint, method = 'GET', body = null, overrideHeaders = null) {
        try {
            const token = getStoredSessionToken();
            const h = { 'Content-Type': 'application/json' };
            if (token) {
                h.Authorization = `Bearer ${token}`;
            }
            applyAIConfigHeaders(h, getStoredAIConfig());

            if (overrideHeaders) {
                for (const [k, v] of Object.entries(overrideHeaders)) {
                    h[k] = v;
                }
            }

            const xhr = new XMLHttpRequest();
            xhr.open(method, endpoint, false);
            xhr.withCredentials = true;
            Object.keys(h).forEach(k => xhr.setRequestHeader(k, h[k]));
            xhr.send(body ? JSON.stringify(body) : null);

            if (xhr.status === 401 || xhr.status === 403) {
                clearStoredSessionToken();
                clearCachedAppState();
                if (window.location.pathname !== '/login') {
                    window.location.assign('/login');
                }
            }

            if (xhr.status < 200 || xhr.status >= 300) {
                const text = xhr.responseText || xhr.statusText || String(xhr.status);
                throw new Error(`API Error (${xhr.status}): ${text}`);
            }

            const text = xhr.responseText || '';
            if (!text) return {};
            const json = JSON.parse(text);
            if (json.error) {
                throw new Error(json.error);
            }
            return json;
        } catch (error) {
            console.error(`[API Error] ${method} ${endpoint}:`, error);
            showAlert("Action failed: " + error.message);
            throw error;
        }
    }

    async function apiCall(endpoint, method = 'GET', body = null, overrideHeaders = null) {
        try {
            const h = { 'Content-Type': 'application/json' };
            applyAIConfigHeaders(h, getStoredAIConfig());

            if (overrideHeaders) {
                for (const [k, v] of Object.entries(overrideHeaders)) {
                    h[k] = v;
                }
            }

            const options = {
                method: method,
                headers: h,
                cache: 'no-store',
                credentials: 'same-origin'
            };
            if (body) {
                options.body = JSON.stringify(body);
            }

            const response = await authFetch(endpoint, options);
            if (!response.ok) {
                if (response.status === 401 || response.status === 403) {
                    clearStoredSessionToken();
                    clearCachedAppState();
                    if (window.location.pathname !== '/login') {
                        window.location.assign('/login');
                    }
                }
                const text = await response.text();
                throw new Error(`API Error (${response.status}): ${text || response.statusText}`);
            }
            const json = await response.json();
            if (json.error) {
                throw new Error(json.error);
            }
            return json;
        } catch (error) {
            console.error(`[API Error] ${method} ${endpoint}:`, error);
            showAlert("Action failed: " + error.message);
            throw error;
        }
    }

    function getStoredAIConfig() {
        const raw = localStorage.getItem('sop_ai_config');
        if (!raw) return {};
        try {
            return JSON.parse(raw) || {};
        } catch (e) {
            return {};
        }
    }

    function setStoredAIConfig(aiConfig) {
        localStorage.setItem('sop_ai_config', JSON.stringify(aiConfig || {}));
    }

    function mergeStoredAIConfig(partialConfig) {
        const nextConfig = Object.assign({}, getStoredAIConfig(), partialConfig || {});
        setStoredAIConfig(nextConfig);
        return nextConfig;
    }

    function splitProviderValue(value) {
        const raw = (value || '').trim();
        if (!raw) return { provider: '', model: '' };
        const sep = raw.indexOf(':');
        if (sep === -1) return { provider: raw, model: '' };
        return {
            provider: raw.slice(0, sep),
            model: raw.slice(sep + 1)
        };
    }

    function buildProviderValue(provider, model) {
        return model ? `${provider}:${model}` : (provider || '');
    }

    function applyAIConfigHeaders(headers, aiConfig) {
        const cfg = aiConfig || {};
        if (cfg.brain_provider) headers['X-LLM-Provider'] = cfg.brain_provider;
        if (cfg.brain_api_key) headers['X-LLM-API-Key'] = cfg.brain_api_key;
        if (cfg.brain_url) headers['X-LLM-URL'] = cfg.brain_url;
        if (cfg.brain_model) headers['X-LLM-Model'] = cfg.brain_model;
        if (cfg.embedder_provider) headers['X-Embedder-Provider'] = cfg.embedder_provider;
        if (cfg.embedder_api_key) headers['X-Embedder-API-Key'] = cfg.embedder_api_key;
        if (cfg.embedder_url) headers['X-Embedder-URL'] = cfg.embedder_url;
        if (cfg.embedder_model) headers['X-Embedder-Model'] = cfg.embedder_model;
        return headers;
    }

    function openUIModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) {
            modal.style.display = 'flex';
        } else {
            console.warn("openUIModal: Modal not found ->", modalId);
        }
    }

    function closeUIModal(modalId) {
        const modal = document.getElementById(modalId);
        if (modal) {
            modal.style.display = 'none';
        }
    }

    /* --- Global Modal Helpers --- */
    let _confirmCallback = null;
    let _alertCallback = null;

    function showAlert(message, callback, titleText="Alert", titleColor="") {
        const titleEl = document.getElementById('global-alert-title');
        if (titleEl) {
            titleEl.textContent = titleText;
            titleEl.style.color = titleColor || "var(--text-color)";
        }
        document.getElementById('global-alert-message').textContent = message;
        _alertCallback = callback;
        openUIModal('global-alert-modal');
        // Focus OK button for usability
        setTimeout(() => document.getElementById('global-alert-modal').querySelector('button').focus(), 50);
    }

    function closeGlobalAlert() {
        closeUIModal('global-alert-modal');
        if (_alertCallback) {
            _alertCallback();
            _alertCallback = null;
        }
    }

    let _confirmKeyHandler = null;

    function showConfirm(message, onConfirm, onCancel, title="Confirm", okText="OK", cancelText="Cancel") {
        document.getElementById('global-confirm-title').textContent = title;
        document.getElementById('global-confirm-message').textContent = message;
        
        const okBtn = document.getElementById('global-confirm-ok-btn');
        const cancelBtn = document.getElementById('global-confirm-cancel-btn');

        okBtn.textContent = okText;
        cancelBtn.textContent = cancelText;

        // Remove old listeners to avoid stacking
        const newOk = okBtn.cloneNode(true);
        okBtn.parentNode.replaceChild(newOk, okBtn);
        
        const newCancel = cancelBtn.cloneNode(true);
        cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);

        const cleanup = () => {
            closeUIModal('global-confirm-modal');
            if (_confirmKeyHandler) {
                document.removeEventListener('keydown', _confirmKeyHandler, true);
                _confirmKeyHandler = null;
            }
        };

        newOk.onclick = function() {
            cleanup();
            if (onConfirm) onConfirm();
        };

        newCancel.onclick = function() {
            cleanup();
            if (onCancel) onCancel();
        };

        // Keyboard handling
        if (_confirmKeyHandler) document.removeEventListener('keydown', _confirmKeyHandler, true);
        _confirmKeyHandler = function(e) {
            if (e.key === 'Escape') {
                e.preventDefault();
                e.stopPropagation();
                newCancel.click();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                e.stopPropagation();
                newOk.click();
            }
        };
        document.addEventListener('keydown', _confirmKeyHandler, true);

        openUIModal('global-confirm-modal');
        setTimeout(() => newOk.focus(), 50);
    }

    function closeGlobalConfirm() {
        closeUIModal('global-confirm-modal');
        if (_confirmKeyHandler) {
            document.removeEventListener('keydown', _confirmKeyHandler, true);
            _confirmKeyHandler = null;
        }
    }

    function confirmAsync(message, title="Confirm") {
        return new Promise((resolve) => {
            showConfirm(message, () => resolve(true), () => resolve(false), title);
        });
    }
    
    let _promptKeyHandler = null;

    function showPrompt(message, onConfirm, onCancel, title="Prompt", placeholder="", okText="OK", cancelText="Cancel") {
         document.getElementById('global-prompt-title').textContent = title;
         document.getElementById('global-prompt-message').textContent = message;
         
         const input = document.getElementById('global-prompt-input');
         input.value = "";
         input.placeholder = placeholder;
         
         const okBtn = document.getElementById('global-prompt-ok-btn');
         const cancelBtn = document.getElementById('global-prompt-cancel-btn');

         okBtn.textContent = okText;
         cancelBtn.textContent = cancelText;

         // Remove old listeners
         const newOk = okBtn.cloneNode(true);
         okBtn.parentNode.replaceChild(newOk, okBtn);
         
         const newCancel = cancelBtn.cloneNode(true);
         cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);

         const cleanup = () => {
             closeUIModal('global-prompt-modal');
             if (_promptKeyHandler) {
                 document.removeEventListener('keydown', _promptKeyHandler, true);
                 _promptKeyHandler = null;
             }
         };

         newOk.onclick = function() {
             const val = input.value;
             cleanup();
             if (onConfirm) onConfirm(val);
         };

         newCancel.onclick = function() {
             cleanup();
             if (onCancel) onCancel();
         };

        // Keyboard handling
        if (_promptKeyHandler) document.removeEventListener('keydown', _promptKeyHandler, true);
        _promptKeyHandler = function(e) {
            if (e.key === 'Escape') {
                e.preventDefault();
                e.stopPropagation();
                newCancel.click();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                e.stopPropagation();
                newOk.click();
            }
        };
        document.addEventListener('keydown', _promptKeyHandler, true);

        openUIModal('global-prompt-modal');
        setTimeout(() => input.focus(), 50);
    }
    
    function promptAsync(message, title="Prompt") {
         return new Promise((resolve) => {
             showPrompt(message, (val) => resolve(val), () => resolve(null), title);
         });
    }
    
    // Override native alert to use our themed custom modal
    window.alert = function(msg) { showAlert(msg); };

    // Escape Key Handler for Modals (KeyDown)
    document.addEventListener('keydown', function(event) {
        if (event.key === "Escape") {
            const modals = [
                // Topmost Priority
                'global-alert-modal',
                'global-confirm-modal',
                'confirm-modal', 
                
                // Specific Modals
                'preferences-modal', 
                'script-modal', 
                'add-store-modal',
                'store-details-modal',
                'cel-modal',
                'column-modal', 
                'add-modal', 
                
                // Environment/DB Managers
                'delete-env-modal',
                'add-database-modal',
                'delete-database-modal',
                'environments-modal',
                'switch-env-modal',
                
                // Spaces
                'add-kb-modal',
                'edit-kb-modal'
                // NOTE: setup-wizard moved to keyup handler to prevent confirmation dialog conflict
            ];
            
            for (const id of modals) {
                const el = document.getElementById(id);
                // check if the element exists and is visible (display matching flex or block)
                if (el && el.style.display !== 'none' && el.style.display !== '') {
                    
                    event.preventDefault(); 
                    event.stopImmediatePropagation();

                    // Specific close functions handling
                    if (id === 'add-modal') closeAdd();
                    else if (id === 'add-kb-modal') closeAddKBModal();
                    else if (id === 'edit-kb-modal') closeEditKBModal();
                    else if (id === 'global-alert-modal') closeGlobalAlert();
                    else if (id === 'global-confirm-modal') closeGlobalConfirm();
                    else if (id === 'preferences-modal') closePreferences();
                    else if (id === 'script-modal') closeScriptModal();
                    else if (id === 'add-store-modal') closeAddStoreModal();
                    else if (id === 'store-details-modal') closeStoreDetailsModal();
                    else if (id === 'cel-modal') closeCelModal();
                    else if (id === 'delete-env-modal') closeDeleteEnvModal();
                    else if (id === 'add-database-modal') closeAddDatabaseModal();
                    else if (id === 'delete-database-modal') closeDeleteDatabaseModal();
                    else if (id === 'environments-modal') closeEnvironmentsManager();
                    else if (id === 'switch-env-modal') closeSwitchEnvModal();
                    else el.style.display = 'none'; // Default fallback
                    
                    return; // Stop processing other modals
                }
            }
        }
    });

    // Dedicated KeyUp Listener for Setup Wizard (prevents double-triggering confirmation)
    document.addEventListener('keyup', function(event) {
        const wizard = document.getElementById('setup-wizard');
        if (wizard && wizard.style.display !== 'none' && wizard.style.display !== '') {
            // Ensure no other modal is covering it (simple check)
            if(document.getElementById('global-alert-modal').style.display === 'flex') return;
            if(document.getElementById('global-confirm-modal').style.display === 'flex') return;
            
            if (event.key === "Escape") {
                event.preventDefault();
                event.stopImmediatePropagation();
                wizardCancel();
            } else if (event.key === "Enter") {
                // On page 3 (Finish), support Enter key to complete setup
                if (typeof currentWizardStep !== 'undefined' && currentWizardStep === 3) {
                    // Don't trigger if user is typing in a textarea
                    if (event.target.tagName === 'TEXTAREA') return;
                    
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    wizardNext();
                }
            }
        }
    });

    let currentDatabase = null;
    let currentSessionID = "";
    
    let currentUserID = localStorage.getItem("sop_userId");
    if (!currentUserID) {
        currentUserID = crypto.randomUUID ? crypto.randomUUID() : 'user-' + Date.now();
        localStorage.setItem("sop_userId", currentUserID);
    }
    
    let currentStore = null;
    let firstKey = null;
    let lastKey = null;
    let currentStoreInfo = null;
    let currentItemKey = null;
    
    const CURRENT_CONFIG_FILE = "{{ .ConfigFile }}";

    // Environment Flags
    // ALLOW_INVALID_MAP_KEY: If true, allows saving a store with Map Key type without
    // requiring an Index Specification or CEL Expression. Controlled by SOP_ALLOW_INVALID_MAP_KEY env var.
    const ALLOW_INVALID_MAP_KEY = {{ .AllowInvalidMapKey }};
    const IS_ENTERPRISE = {{ .IsEnterprise }};
    const SYSTEM_DB_NAME = "{{ .SystemDBName }}";
    
    // Dropdown Logic for Enterprise Mode
    function toggleDbDropdown() {
        const menu = document.getElementById('db-dropdown-menu');
        if (menu.style.display === 'block') {
            menu.style.display = 'none';
        } else {
            menu.style.display = 'block';
        }
    }

    // Close Dropdown when clicking outside
    document.addEventListener('click', function(event) {
        const chip = document.getElementById('db-chip');
        const menu = document.getElementById('db-dropdown-menu');
        if (chip && menu && !chip.contains(event.target) && !menu.contains(event.target)) {
            menu.style.display = 'none';
        }
    });

    let currentItems = [];
    let currentKeyColumnWidth = '45%';
    let columnWidths = [];
    let availableDatabases = [];
    const CHIP_ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M5 0a.5.5 0 0 1 .5.5V2h1V.5a.5.5 0 0 1 1 0V2h1V.5a.5.5 0 0 1 1 0V2h1V.5a.5.5 0 0 1 1 0V2A2.5 2.5 0 0 1 14 4.5h1.5a.5.5 0 0 1 0 1H14v1h1.5a.5.5 0 0 1 0 1H14v1h1.5a.5.5 0 0 1 0 1H14v1h1.5a.5.5 0 0 1 0 1H14a2.5 2.5 0 0 1-2.5 2.5v1.5a.5.5 0 0 1-1 0V14h-1v1.5a.5.5 0 0 1-1 0V14h-1v1.5a.5.5 0 0 1-1 0V14h-1v1.5a.5.5 0 0 1-1 0V14A2.5 2.5 0 0 1 2 11.5H.5a.5.5 0 0 1 0-1H2v-1H.5a.5.5 0 0 1 0-1H2v-1H.5a.5.5 0 0 1 0-1H2v-1H.5a.5.5 0 0 1 0-1H2A2.5 2.5 0 0 1 4.5 2V.5A.5.5 0 0 1 5 0zm-.5 3A1.5 1.5 0 0 0 3 4.5v7A1.5 1.5 0 0 0 4.5 13h7a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 11.5 3h-7zM5 6.5A1.5 1.5 0 0 1 6.5 5h3A1.5 1.5 0 0 1 11 6.5v3A1.5 1.5 0 0 1 9.5 11h-3A1.5 1.5 0 0 1 5 9.5v-3z"/></svg>`;

    // Load Databases on Start
    // Refactored into a reusable function to support dynamic database switching
    window.reloadDatabases = function(autoSelect = true) {
        return apiCall('/api/databases')
            .then(databases => {
                availableDatabases = databases;

                let systemDB = databases ? databases.find(d => d.is_system) : null;
                let sysName = systemDB ? systemDB.name : "system";

                return apiCall(`/api/spaces?database=${encodeURIComponent(sysName)}`)
                    .then(res => (res && res.data) ? res.data : [])
                    .catch(e => [])
                    .then(spaces => {
                        // Build a warning alert for missing databases
                        let warnings = [];
                        if (databases && databases.length > 0) {
                            databases.forEach(db => {
                                if (db.warning) {
                                    warnings.push("• " + db.warning);
                                }
                            });
                        }
                        
                        // Check if SOP KB exists in the System DB
                        if (databases && databases.length > 0 && !spaces.includes("SOP")) {
                            warnings.push("• SOP KB (KnowledgeBase) Space is missing from the System Database.");
                        }

                        if (warnings.length > 0) {
                            showAlert("SOP Configuration Missing:\n\n" + warnings.join("\n"), null, "Alert", "red");
                        }
                
                if (!databases || databases.length === 0) {
                    const select = document.getElementById('database-select');
                    select.innerHTML = '';
                    const opt = document.createElement('option');
                    opt.textContent = "No databases found";
                    select.appendChild(opt);

                    openUIModal('database-section', 'block');
                    
                    // Disable UI elements when no databases exist
                    const btnAddDb = document.getElementById('btn-add-database');
                    if(btnAddDb) {
                        btnAddDb.style.opacity = '0.3';
                        btnAddDb.style.pointerEvents = 'none';
                    }
                    const btnAddStore = document.getElementById('btn-add-store');
                    if(btnAddStore) {
                        btnAddStore.style.opacity = '0.3';
                        btnAddStore.style.pointerEvents = 'none';
                    }
                    const btnChat = document.getElementById('chat-toggle-btn');
                    if(btnChat) {
                        btnChat.style.display = 'none';
                    }
                    
                    // Check if we should suppress the wizard (e.g. redirected after cancel)
                    if (sessionStorage.getItem('sop_suppress_wizard_once')) {
                        sessionStorage.removeItem('sop_suppress_wizard_once');

                        // Check if we also need to open the Environment Manager (Post-Cancel)
                        if (sessionStorage.getItem('sop_open_env_manager')) {
                            sessionStorage.removeItem('sop_open_env_manager');
                            showEnvironmentsManager();
                        }
                        return;
                    }
                    
                    showSetupWizard();
                    return;
                }
                
                openUIModal('database-section', 'block');

                const userDBs = databases.filter(db => !db.is_system);
                const systemDBs = databases.filter(db => db.is_system);

                if (IS_ENTERPRISE) {

    async function refreshSpacesList(databaseName, spaceToSelect = null) {
        const normalizedSpaceToSelect = typeof spaceToSelect === 'string'
            ? spaceToSelect.replace(/\/data$/, '')
            : null;
        const bundle = await apiCall(`/api/spaces?database=${encodeURIComponent(databaseName)}&user_id=${encodeURIComponent(currentUserID)}&_=${Date.now()}`);
        let kbs = bundle.data || [];
        const kbList = document.getElementById('kb-list');
        const domainSelect = document.getElementById('domain-select');

        kbList.innerHTML = '';

        if (domainSelect) {
            Array.from(domainSelect.options).forEach(opt => {
                if (opt.getAttribute('data-dynamic') === 'true') {
                    domainSelect.removeChild(opt);
                }
            });
        }

        if (!kbs || kbs.length === 0) {
            kbList.innerHTML = '<li>No Spaces found</li>';
            return;
        }

        let selectedElement = null;
        let selectedName = null;
        kbs.forEach(kb => {
            const li = document.createElement('li');
            li.textContent = kb.charAt(0).toUpperCase() + kb.slice(1);
            li.title = kb;
            li.classList.add('truncate-text');
            li.onclick = () => selectSpace(kb, li);
            kbList.appendChild(li);

            if (normalizedSpaceToSelect && kb === normalizedSpaceToSelect) {
                selectedElement = li;
                selectedName = kb;
            }

            if (domainSelect) {
                const existing = Array.from(domainSelect.options).find(o => o.value === kb);
                let canSelect = true;
                if (bundle.item_rbac && bundle.item_rbac[kb] && bundle.item_rbac[kb]["can_ai_select"] === false) {
                    canSelect = false;
                }
                if (!existing && canSelect) {
                    const opt = document.createElement('option');
                    opt.value = kb;
                    opt.textContent = kb.charAt(0).toUpperCase() + kb.slice(1);
                    opt.setAttribute('data-dynamic', 'true');
                    domainSelect.appendChild(opt);
                }
            }
        });

        if (selectedElement && selectedName) {
            const kbContainer = document.getElementById('kb-list-container');
            const kbCaret = document.getElementById('kb-caret');
            if (kbContainer && kbContainer.style.display === 'none') {
                kbContainer.style.display = 'block';
            }
            if (kbCaret) {
                kbCaret.textContent = '▼';
            }
            setTimeout(() => selectSpace(selectedName, selectedElement), 50);
        }
    }

    async function selectDatabase(name, forceRefresh = false, storeToSelect = null) {
        if (!forceRefresh && currentDatabase === name) return;

        // Check for unsaved changes
        if (!await closeDetail()) {
            // Revert selection
            const select = document.getElementById('database-select');
            if (select && currentDatabase) {
                select.value = currentDatabase;
            }
            return;
        }

        currentDatabase = name;
        localStorage.setItem('sop_current_database', name);

        // Hardening: Hide Add Store button for System DB / System DBs
        const dbObj = availableDatabases.find(d => d.name === name);
        const btnAddStore = document.getElementById('btn-add-store');
        // Define isSystemDB locally so we can reuse it in the store listing
        const isSystemDB = (dbObj && dbObj.is_system) || name === 'system' || name === SYSTEM_DB_NAME;

        if (btnAddStore) {
            // Check implicit system names too just in case is_system missing
            if (isSystemDB) {
                 btnAddStore.style.display = 'none';
            } else {
                 btnAddStore.style.display = 'inline-block';
            }
        }

        currentStore = null;
        document.getElementById('store-list').innerHTML = '<li>Loading...</li>';
        document.getElementById('current-store-title').textContent = 'Select Store or Context Space';
        
        // Hide all store-specific buttons
        closeUIModal('btn-delete-store');
        closeUIModal('btn-code-store');
        closeUIModal('btn-edit-store');
        closeUIModal('btn-view-store');
        closeUIModal('btn-edit-cel');
        closeUIModal('btn-edit-kb');
        closeUIModal('btn-export-kb');
        closeUIModal('btn-import-kb');
        closeUIModal('btn-delete-kb');
        closeUIModal('btn-add-kb-category');

        document.getElementById('data-grid').innerHTML = '';
        closeUIModal('toolbar');
        closeUIModal('pagination');
        closeUIModal('pagination-top');
        
        // Reset DB Options
        document.getElementById('db-options-section').style.display = 'none';
        document.getElementById('db-options-content').innerHTML = 'Loading...';
        
        apiCall(`/api/stores?database=${encodeURIComponent(name)}&_=${Date.now()}`)
            .then(bundle => {
                let stores = bundle.data || [];
                if (bundle.rbac) { window.CONTEXT_RBAC["store"] = bundle.rbac; }
                const list = document.getElementById('store-list');
                list.innerHTML = '';
                if (!stores || stores.length === 0) {
                    list.innerHTML = '<li>No stores found</li>';
                    return;
                }
                stores.forEach(store => {
                    const li = document.createElement('li');
                    li.textContent = store.charAt(0).toUpperCase() + store.slice(1);
                    li.title = store;
                    li.classList.add('truncate-text');
                    li.onclick = () => selectStore(store, li);
                    list.appendChild(li);

                    if (storeToSelect && store === storeToSelect) {
                        selectStore(store, li);
                    }
                });
            })
            .catch(err => {
                const list = document.getElementById('store-list');
                list.innerHTML = `<li class="error-text">Error: ${err.message}</li>`;
            });

        // Fetch Spaces
        refreshSpacesList(name, storeToSelect)
            .catch(err => {
                const kbList = document.getElementById('kb-list');
                kbList.innerHTML = `<li class="error-text">Error: ${err.message}</li>`;
            });

        // Fetch DB Options
        apiCall(`/api/db/options?database=${encodeURIComponent(name)}`)
            .then(opts => {
                const section = document.getElementById('db-options-section');
                const content = document.getElementById('db-options-content');
                section.style.display = 'block';
                
                let html = '';
                
                // Display Mode (Type)
                // L2CacheType: 2=Redis (Clustered), others (0=NoCache, 1=InMemory) = Standalone
                const typeStr = (opts.cache_type === 2) ? "Clustered" : "Standalone";
                html += `<div style="margin-bottom: 5px;"><strong>Type:</strong> ${typeStr}</div>`;

                if (opts.stores_folders && opts.stores_folders.length > 0) {
                    html += '<strong>Stores Folders:</strong><ul style="margin: 0; padding-left: 20px; list-style-type: disc;">';
                    opts.stores_folders.forEach(f => {
                        // Shorten path logic:
                        // Only shorten if length > 27 characters
                        let shortPath = f;
                        if (f.length > 27) {
                            // Split by / or \
                            const parts = f.split(/[/\\]/).filter(p => p.length > 0);
                            if (parts.length > 2) {
                                shortPath = '../' + parts[parts.length - 2] + '/' + parts[parts.length - 1];
                            }
                        }
                        
                        // Escape for JS string
                        const safePath = f.replace(/\\/g, '\\\\').replace(/\u0027/g, "\\'");
                        
                        html += `<li style="cursor: copy; padding: 2px 0;" 
                                     title="${f} (Click to Copy)"
                                     onclick="navigator.clipboard.writeText('${safePath}').then(() => { const el = this; const orig = el.style.color; el.style.color = '#4caf50'; setTimeout(() => el.style.color = orig, 500); });">
                                    ${shortPath}
                                 </li>`;
                    });
                    html += '</ul>';
                }
                
                if (opts.erasure_config && Object.keys(opts.erasure_config).length > 0) {
                    html += '<details><summary style="cursor: pointer; font-weight: bold; margin-bottom: 5px;">Erasure Config</summary><pre style="margin: 0; font-size: 10px; overflow-x: visible;">' + JSON.stringify(opts.erasure_config, null, 2) + '</pre></details>';
                }

                if (opts.redis_config) {
                    html += '<details><summary style="cursor: pointer; font-weight: bold; margin-bottom: 5px;">Redis Config</summary><pre style="margin: 0; font-size: 10px; overflow-x: visible;">' + JSON.stringify(opts.redis_config, null, 2) + '</pre></details>';
                }
                
                if (!html) {
                    html = 'No specific options found.';
                }
                content.innerHTML = html;
            })
            .catch(err => {
                console.error("Failed to fetch DB options", err);
                document.getElementById('db-options-content').innerHTML = '<span class="error-text">Failed to load options</span>';
                document.getElementById('db-options-section').style.display = 'block';
            });
    }

    function isPinnedInternalSpace(spaceName) {
        const cleanName = typeof spaceName === 'string'
            ? spaceName.replace(/\/data$/, '').replace(/_/g, ' ').replace(/-/g, ' ').toLowerCase().trim()
            : '';
        const normalized = cleanName.split(/\s+/).filter(Boolean).join(' ');
        return normalized === 'sop' || normalized === 'sop kb' || normalized === 'sop knowledge base'
            || normalized === 'medical' || normalized === 'medical kb' || normalized === 'medical knowledge base';
    }

    function isSpaceReadOnly(spaceName, databaseName) {
        const cleanName = typeof spaceName === 'string' ? spaceName.replace(/\/data$/, '') : spaceName;
        if (isPinnedInternalSpace(cleanName)) {
            return true;
        }
        if (cleanName && window.CONTEXT_RBAC && window.CONTEXT_RBAC["space_" + cleanName]) {
             return !window.CONTEXT_RBAC["space_" + cleanName].can_edit;
        }
        return false;
    }

    function isSpaceDeleteProtected(spaceName) {
        const cleanName = typeof spaceName === 'string'
            ? spaceName.replace(/\/data$/, '').replace(/_/g, ' ').replace(/-/g, ' ').toLowerCase().trim()
            : '';
        const normalized = cleanName.split(/\s+/).filter(Boolean).join(' ');
        return normalized === 'sop' || normalized === 'sop kb' || normalized === 'sop knowledge base';
    }

    window.escapeHTML = function(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/"/g, '&quot;')
              .replace(/'/g, '&#39;')
              .replace(/\n/g, '&#10;')
              .replace(/\r/g, '&#13;');
};

    window.normalizeDocIDs = function(docID) {
        if (Array.isArray(docID)) {
            return docID.filter(Boolean);
        }
        return docID ? [docID] : [];
    };

    window.isExternalDocID = function(docID) {
        return /^(https?:\/\/|file:\/\/|mailto:)/i.test(String(docID || '').trim());
    };

    window.buildDocViewerURL = function(docID, text) {
        const value = String(docID || '').trim();
        if (window.isExternalDocID(value)) {
            return value;
        }

        const url = new URL('/viewer', window.location.origin);
        const pageParams = new URLSearchParams(window.location.search || '');
        const db = (typeof currentDatabase !== 'undefined' && currentDatabase) ? currentDatabase : (pageParams.get('db') || pageParams.get('database') || '');
        const space = (typeof spaceName !== 'undefined' && spaceName) ? spaceName : (pageParams.get('space') || '');

        url.searchParams.set('docID', value);
        if (db) url.searchParams.set('db', db);
        if (space) url.searchParams.set('space', space);
        url.searchParams.set('text', text || '');
        return url.toString();
    };

    window.closeDocSourcePopup = function() {
        const popup = document.getElementById('doc-source-popup-menu');
        if (popup) popup.remove();
        document.removeEventListener('click', window._docSourcePopupOutsideHandler);
        delete window._docSourcePopupOutsideHandler;
    };

    window.openDocSourcePopup = function(event, button, docIDs, text) {
        event.preventDefault();
        event.stopPropagation();

        if (!docIDs || docIDs.length === 0) return;
        if (docIDs.length === 1) {
            window.location.href = window.buildDocViewerURL(docIDs[0], text);
            return;
        }

        window.closeDocSourcePopup();

        const popup = document.createElement('div');
        popup.id = 'doc-source-popup-menu';
        popup.style.position = 'fixed';
        popup.style.top = `${event.clientY + 8}px`;
        popup.style.left = `${event.clientX + 8}px`;
        popup.style.zIndex = '10000';
        popup.style.minWidth = '320px';
        popup.style.maxWidth = '420px';
        popup.style.maxHeight = '320px';
        popup.style.overflowY = 'auto';
        popup.style.background = 'var(--bg-color)';
        popup.style.border = '1px solid var(--border-color)';
        popup.style.borderRadius = '8px';
        popup.style.boxShadow = '0 10px 24px rgba(0,0,0,0.18)';
        popup.style.padding = '8px';
        popup.style.display = 'grid';
        popup.style.gap = '6px';
        popup.style.fontSize = '0.85em';
        popup.style.lineHeight = '1.3';

        docIDs.forEach(docID => {
            const link = document.createElement('a');
            link.href = window.buildDocViewerURL(docID, text);
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = docID;
            link.style.display = 'block';
            link.style.padding = '8px 10px';
            link.style.borderRadius = '6px';
            link.style.color = 'var(--text-color)';
            link.style.textDecoration = 'none';
            link.style.background = 'rgba(100,100,100,0.08)';
            link.style.wordBreak = 'break-all';
            link.style.fontSize = '0.85em';
            link.style.lineHeight = '1.3';
            link.addEventListener('click', () => window.closeDocSourcePopup());
            popup.appendChild(link);
        });

        document.body.appendChild(popup);

        requestAnimationFrame(() => {
            const rect = popup.getBoundingClientRect();
            const maxLeft = Math.max(8, window.innerWidth - rect.width - 8);
            const maxTop = Math.max(8, window.innerHeight - rect.height - 8);
            const nextLeft = Math.min(event.clientX + 8, maxLeft);
            const nextTop = Math.min(event.clientY + 8, maxTop);
            popup.style.left = `${Math.max(8, nextLeft)}px`;
            popup.style.top = `${Math.max(8, nextTop)}px`;
        });

        window._docSourcePopupOutsideHandler = function(e) {
            if (!popup.contains(e.target) && e.target !== button) {
                window.closeDocSourcePopup();
            }
        };
        document.addEventListener('click', window._docSourcePopupOutsideHandler);
    };

    function isStoreReadOnly(info) {
        if (!info) return true;
        
        // Check System DB status
        const dbObj = availableDatabases && currentDatabase ? availableDatabases.find(d => d.name === currentDatabase) : null;
        const isSystem = (dbObj && dbObj.is_system) || currentDatabase === 'system' || currentDatabase === SYSTEM_DB_NAME;

        // Protected Stores
        const storeName = info.name || currentStore;
        if (storeName === 'llm_feedback') return true;

        if (isSpaceReadOnly(storeName, currentDatabase)) return true;

        const hasIndex = info.indexSpec && info.indexSpec.index_fields && info.indexSpec.index_fields.length > 0;
        const hasCel = !!info.celExpression;
        const isPrimitiveMetadata = info.isPrimitiveKey;
        
        let isPrimitiveData = false;
        if (info.count > 0 && info.sampleKey !== undefined && info.sampleKey !== null) {
             const t = typeof info.sampleKey;
             if (t !== 'object' || Array.isArray(info.sampleKey)) {
                 isPrimitiveData = true;
             }
        }
        
        const hasSchema = hasIndex || hasCel || isPrimitiveMetadata || isPrimitiveData;
        return !hasSchema;
    }

    async function refreshCategoryCache(spaceName) {
        try {
            const res = await authFetch(`/api/spaces/categories?database=${encodeURIComponent(currentDatabase)}&name=${encodeURIComponent(spaceName)}&offset=0&limit=500&parent_id=`);
            if (!res.ok) throw new Error('Failed to refresh categories');

            const payload = await res.json();
            const freshCategories = Array.isArray(payload) ? payload : (payload && Array.isArray(payload.data) ? payload.data : []);
            window._currentKBCategories = freshCategories;

            if (window._lastFetchItemsArgs && window._lastFetchItemsArgs.categoryId) {
                const freshCat = freshCategories.find(c => c.id === window._lastFetchItemsArgs.categoryId);
                if (freshCat) {
                    window._lastFetchItemsArgs.catObj = freshCat;
                }
            }
            return freshCategories;
        } catch (err) {
            console.error('Failed to refresh category cache', err);
            return [];
        }
    }

                                <option value="100" ${window._currentLimit === 100 ? 'selected' : ''}>100 / page</option>
                                <option value="500" ${window._currentLimit === 500 ? 'selected' : ''}>500 / page</option>
                            </select>
                            ${actionButtons}
                        </div>
                    </div>
                    <div id="kb-items-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; align-content: flex-start; padding-bottom: 20px;">
                        <div style="padding: 15px;">Please select a category.</div>
                    </div>
                </div>
            </div>
        `;

        grid.innerHTML = html;

        // Add resizing behavior
        const resizer = document.getElementById('tree-resizer');
        const treePane = document.getElementById('category-tree-pane');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            // Prevent text selection during drag
            document.body.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            // Calculate new width relative to the left side of the screen
            // or the container's bounds if we want to be more precise.
            const containerRect = grid.getBoundingClientRect();
            // grid usually has some padding/margin to account for.
            let newWidth = e.clientX - treePane.getBoundingClientRect().left;
            
            // Constrain width
            if (newWidth < 150) newWidth = 150;
            if (newWidth > containerRect.width * 0.7) newWidth = containerRect.width * 0.7; // Max 70% of pane
            
            treePane.style.width = `${newWidth}px`;
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
            }
        });

        // Recursively render tree
        const treeRoot = document.querySelector('#kb-category-tree');
        function renderTreeNodes(catList, container, depth=0) {
            catList.forEach(cat => {
                const li = document.createElement('li');
                li.style.marginBottom = '6px';
                li.style.marginLeft = (depth > 0 ? 10 : 0) + 'px';
                li.style.cursor = 'pointer';
                li.style.color = 'var(--text-color)';
                li.style.padding = '4px 1px 4px 0px';
                li.style.borderRadius = '4px';
                li.style.display = 'flex';
                li.style.justifyContent = 'space-between';
                li.style.alignItems = 'center';
                
                li.onclick = (e) => {
                    e.stopPropagation();
                    window.fetchItemsForCategory(name, cat.id, cat.name, li, cat);
                };

                const hasChildren = (cat.children && cat.children.length > 0) || (childrenMap[cat.id] && childrenMap[cat.id].length > 0);
                const isExpanded = childrenMap[cat.id] && childrenMap[cat.id].length > 0;

                const arrowSpan = document.createElement('span');
                arrowSpan.innerHTML = hasChildren ? (isExpanded ? '▾ ' : '▸ ') : '◦ ';
                arrowSpan.style.cursor = hasChildren ? 'pointer' : 'default';
                arrowSpan.style.display = 'inline-block';
                arrowSpan.style.width = '16px';
                arrowSpan.style.textAlign = 'left';
                arrowSpan.style.flexShrink = '0';

                const titleSpan = document.createElement('span');
                titleSpan.innerHTML = cat.name;
                titleSpan.style.whiteSpace = 'nowrap';
                titleSpan.style.overflow = 'hidden';
                titleSpan.style.textOverflow = 'ellipsis';
                titleSpan.title = cat.name;

                const childrenContainer = document.createElement('ul');
                childrenContainer.style.listStyle = 'none';
                childrenContainer.style.paddingLeft = '0';
                childrenContainer.style.marginTop = '0px';
                childrenContainer.style.marginBottom = isExpanded ? '6px' : '0px';
                childrenContainer.style.display = isExpanded ? 'block' : 'none';

                li.style.marginBottom = isExpanded ? '0px' : '6px';

                arrowSpan.onclick = async (e) => {
                    e.stopPropagation();
                    if (!hasChildren) return;
                    
                    if (childrenContainer.style.display === 'none') {
                        arrowSpan.innerHTML = '▾ ';
                        childrenContainer.style.display = 'block';
                        li.style.marginBottom = '0px';
                        childrenContainer.style.marginBottom = '6px';
                        
                        if (childrenContainer.children.length === 0) {
                            arrowSpan.innerHTML = '⌛ ';
                            try {
                                const resCat = await authFetch(`/api/spaces/categories?database=${encodeURIComponent(currentDatabase)}&name=${encodeURIComponent(name)}&parent_id=${cat.id}&offset=0&limit=500`);
                                if (resCat.ok) {
                                    const data = await resCat.json();
                                    let childrenData = Array.isArray(data) ? data : (data.data || []);
                                    childrenData.forEach(c => {
                                        if (!window._currentKBCategories.find(existing => existing.id === c.id)) {
                                            window._currentKBCategories.push(c);
                                        }
                                    });
                                    childrenData.sort((a,b) => a.name.localeCompare(b.name));
                                    renderTreeNodes(childrenData, childrenContainer, depth+1);
                                }
                            } catch(err) {
                                console.error('Failed to fetch sub-categories', err);
                            }
                            arrowSpan.innerHTML = '▾ ';
                        }
                    } else {
                        arrowSpan.innerHTML = '▸ ';
                        childrenContainer.style.display = 'none';
                        li.style.marginBottom = '6px';
                        childrenContainer.style.marginBottom = '0px';
                    }
                };

                const addSubBtn = document.createElement('span');
                addSubBtn.innerHTML = '+';
                addSubBtn.title = 'Add Sub-Category';
                addSubBtn.style.marginLeft = '8px';
                addSubBtn.style.cursor = 'pointer';
                addSubBtn.style.color = 'var(--key-color)';
                addSubBtn.style.fontSize = '1.1em';
                addSubBtn.style.fontWeight = 'bold';
                addSubBtn.style.display = 'none'; // hidden by default, shown on hover
                
                li.onmouseover = () => { li.style.background = 'rgba(0,0,0,0.03)'; addSubBtn.style.display = 'inline'; };
                li.onmouseout = () => { li.style.background = 'transparent'; addSubBtn.style.display = 'none'; };

                addSubBtn.onclick = (e) => {
                    e.stopPropagation();
                    window.showAddCategoryModal(cat.id);
                };

                const titleContainer = document.createElement('div');
                titleContainer.style.display = 'flex';
                titleContainer.style.alignItems = 'center';
                titleContainer.style.overflow = 'hidden';
                titleContainer.appendChild(arrowSpan);
                titleContainer.appendChild(titleSpan);
                if (!isReadOnlyKB) {
                    titleContainer.appendChild(addSubBtn);
                }

                li.appendChild(titleContainer);
                
                container.appendChild(li);

                if (isExpanded) {
                    renderTreeNodes(childrenMap[cat.id], childrenContainer, depth+1);
                }
                container.appendChild(childrenContainer);
            });
        }
        
        if (roots.length > 0) {
            renderTreeNodes(roots.sort((a,b) => a.name.localeCompare(b.name)), treeRoot);
        }
        
        // Category Pagination UI
        const totalCatPages = Math.ceil(totalCatCount / catLimit);
        const currentCatPage = Math.floor(catOffset / catLimit) + 1;
        if (totalCatPages > 1) {
            let pHtml = `<div style="display: flex; gap: 5px; margin-top: 0px; align-items: center; justify-content: center; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--border-color);">`;
            
            if (currentCatPage > 1) {
                pHtml += `<button onclick="window.selectSpace('${window.escapeHTML(name)}', document.querySelector('#sidebar li.active'), false, ${catOffset - catLimit}, ${catLimit})" style="padding: 2px 6px; font-size: 0.85em; border-radius: 4px; border: 1px solid var(--border-color); background: var(--button-bg); color: var(--text-color); cursor: pointer;">&lt;</button>`;
            }
            
            let sPage = Math.max(1, currentCatPage - 1);
            let ePage = Math.min(totalCatPages, currentCatPage + 1);
            
            if (sPage > 1) {
                pHtml += `<button onclick="window.selectSpace('${window.escapeHTML(name)}', document.querySelector('#sidebar li.active'), false, 0, ${catLimit})" style="padding: 2px 6px; font-size: 0.85em; border-radius: 4px; border: 1px solid var(--border-color); background: var(--button-bg); color: var(--text-color); cursor: pointer;">1</button>`;
                if (sPage > 2) pHtml += `<span style="font-size: 0.85em; color: var(--text-muted);">..</span>`;
            }
            
            for (let i = sPage; i <= ePage; i++) {
                const isC = i === currentCatPage;
                const poff = (i - 1) * catLimit;
                const st = isC 
                    ? `padding: 2px 6px; font-size: 0.85em; border-radius: 4px; border: 1px solid #5b6ed1; background: #5b6ed1; color: white; cursor: default;`
                    : `padding: 2px 6px; font-size: 0.85em; border-radius: 4px; border: 1px solid var(--border-color); background: var(--button-bg); color: var(--text-color); cursor: pointer;`;
                
                pHtml += `<button ${!isC ? `onclick="window.selectSpace('${window.escapeHTML(name)}', document.querySelector('#sidebar li.active'), false, ${poff}, ${catLimit})"` : ''} style="${st}">${i}</button>`;
            }
            
            if (ePage < totalCatPages) {
                if (ePage < totalCatPages - 1) pHtml += `<span style="font-size: 0.85em; color: var(--text-muted);">..</span>`;
                pHtml += `<button onclick="window.selectSpace('${window.escapeHTML(name)}', document.querySelector('#sidebar li.active'), false, ${(totalCatPages - 1) * catLimit}, ${catLimit})" style="padding: 2px 6px; font-size: 0.85em; border-radius: 4px; border: 1px solid var(--border-color); background: var(--button-bg); color: var(--text-color); cursor: pointer;">${totalCatPages}</button>`;
            }

            if (currentCatPage < totalCatPages) {
                pHtml += `<button onclick="window.selectSpace('${window.escapeHTML(name)}', document.querySelector('#sidebar li.active'), false, ${catOffset + catLimit}, ${catLimit})" style="padding: 2px 6px; font-size: 0.85em; border-radius: 4px; border: 1px solid var(--border-color); background: var(--button-bg); color: var(--text-color); cursor: pointer;">&gt;</button>`;
            }
            
            pHtml += `</div>`;
            const pagingWrap = document.createElement('div');
            pagingWrap.innerHTML = pHtml;
            treeRoot.parentNode.appendChild(pagingWrap);
        }

        window.fetchItemsForCategory = async function(spaceName, categoryId, categoryName, liElement, catObj, offset = 0, limit = (window._currentLimit || 50), lastCatId = "", lastItemId = "") {
            window._lastFetchItemsArgs = { spaceName, categoryId, categoryName, liElement, catObj, offset, limit, lastCatId, lastItemId };
            window._currentSelectedCategoryName = categoryName;
            document.querySelectorAll('#kb-category-tree li').forEach(li => {
                li.style.fontWeight = 'normal';
                li.style.color = 'var(--text-color)';
                const strong = li.querySelector('strong');
                if (strong) strong.style.fontWeight = 'normal';
            });
            if (liElement) {
                liElement.style.color = 'var(--link-color)';
                const strong = liElement.querySelector('strong');
                if (strong) strong.style.fontWeight = 'bold';
                else liElement.style.fontWeight = 'bold';
            }

            const headerTitle = document.getElementById('kb-items-header-title');
            headerTitle.innerHTML = '';
            headerTitle.appendChild(document.createTextNode(categoryId ? 'Items in: ' + categoryName : 'All Items'));

            // Determine if DB allows adding items (mostly System DB logic mirroring selectStore)
            let allowAdd = true;
            const currentDbObj = availableDatabases.find(db => db.name === currentDatabase);
            const isSystemDB = currentDbObj ? currentDbObj.is_system : false;
            
            if (currentStore === 'llm_feedback' || (isSystemDB && currentStore === 'memory')) {
                allowAdd = false;
            }

            if (!isReadOnlyKB) {
                // ADD CATEGORY ICON (+)
                const addCatBtn = document.createElement('span');
                addCatBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/></svg>';
                addCatBtn.title = 'Add Category';
                addCatBtn.style.fontSize = '1.1em';
                addCatBtn.style.marginLeft = '10px';
                addCatBtn.style.cursor = 'pointer';
                addCatBtn.style.color = 'var(--text-color)';
                addCatBtn.style.opacity = '0.5';
                addCatBtn.style.verticalAlign = 'middle';
                addCatBtn.style.display = 'inline-flex';
                addCatBtn.style.alignItems = 'center';
                addCatBtn.onmouseover = () => addCatBtn.style.opacity = '1';
                addCatBtn.onmouseout = () => addCatBtn.style.opacity = '0.5';
                addCatBtn.onclick = (e) => {
                    e.stopPropagation();
                    window.showAddCategoryModal();
                };
                headerTitle.appendChild(addCatBtn);
            }

            if (categoryId && catObj) {
                const editBtn = document.createElement('span');
                if (isReadOnlyKB) {
                    editBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/></svg>';
                    editBtn.title = 'View Category';
                } else {
                    editBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/></svg>';
                    editBtn.title = 'Edit Category';
                }
                editBtn.style.fontSize = '1em';
                editBtn.style.marginLeft = '10px';
                editBtn.style.cursor = 'pointer';
                editBtn.style.color = 'var(--text-color)';
                editBtn.style.verticalAlign = 'middle';
                editBtn.style.display = 'inline-flex';
                editBtn.style.alignItems = 'center';
                editBtn.onclick = (e) => {
                    e.stopPropagation();
                    window.editCategoryModal(catObj, spaceName);
                };
                headerTitle.appendChild(editBtn);

                if (!isReadOnlyKB) {
                    const delBtn = document.createElement('span');
                    delBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg>';
                    delBtn.title = 'Delete Category (' + categoryName + ')';
                    delBtn.style.fontSize = '1em';
                    delBtn.style.marginLeft = '10px';
                    delBtn.style.cursor = 'pointer';
                    delBtn.style.color = 'var(--text-color)';
                    delBtn.style.verticalAlign = 'middle';
                    delBtn.style.display = 'inline-flex';
                    delBtn.style.alignItems = 'center';
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        showConfirm(
                            'Are you sure you want to delete the category "' + categoryName + '"? This cannot be undone.',
                            () => {
                                window.deleteCategory(catObj.id, spaceName);
                            },
                            null,
                            "Confirm Deletion",
                            "Delete"
                        );
                    };
                    headerTitle.appendChild(delBtn);
                }
            }

// UI logic for Add Item button used to be here, moved back to actionButtons render logic.

            const tg = document.getElementById('kb-items-grid');
            tg.innerHTML = "<div style='padding: 15px;'>Loading items...</div>";

            try {
                let url = `/api/spaces/items?database=${encodeURIComponent(currentDatabase)}&name=${encodeURIComponent(spaceName)}&offset=${offset}&limit=${limit}`;
                if (categoryId) url += `&category_id=${encodeURIComponent(categoryId)}`;
                if (lastCatId && lastItemId) url += `&last_cat_id=${encodeURIComponent(lastCatId)}&last_item_id=${encodeURIComponent(lastItemId)}`;
                
                const res = await authFetch(url);
                if (!res.ok) throw new Error("Failed to fetch items");
                
                let resPayload = null;
                try {
                        resPayload = await res.json();
                } catch(e){}

                const kbIsReadOnly = isReadOnlyKB;

                let items = resPayload ? resPayload.data || [] : [];
                
                // Sort items natively alphanumerically in the UI for display
                items.sort((a,b) => {
                    let valA = (a.summaries && a.summaries.length ? a.summaries[0] : "") || a.text || a.description || "";
                    let valB = (b.summaries && b.summaries.length ? b.summaries[0] : "") || b.text || b.description || "";
                    
                    let matchA = valA.match(/^\s*(\d+)[\.\)]?\s*/);
                    let matchB = valB.match(/^\s*(\d+)[\.\)]?\s*/);
                    
                    if (matchA && matchB) {
                        let numA = parseInt(matchA[1], 10);
                        let numB = parseInt(matchB[1], 10);
                        if (numA !== numB) {
                            return numA - numB;
                        }
                    } else if (matchA && !matchB) {
                        return 1;
                    } else if (!matchA && matchB) {
                        return -1;
                    }
                    return valA.localeCompare(valB);
                });

                window._lastSpaceItems = items;
                let totalCount = resPayload ? resPayload.total || items.length : items.length;
                if (!items || items.length === 0) {
                    tg.innerHTML = "<div style='padding: 15px;'>No items found.</div>";
                    return;
                }

                let contentHtml = '';
                
                items.forEach(t => {
                    const docIDs = window.normalizeDocIDs(t.doc_id || (t.data && t.data.doc_id));
                    const primaryDocID = docIDs[0] || "";
                    const currentPageParams = new URLSearchParams(window.location.search || '');
                    const currentDB = (typeof currentDatabase !== 'undefined' && currentDatabase) ? currentDatabase : (currentPageParams.get('db') || currentPageParams.get('database') || '');
                    const currentSpace = (typeof spaceName !== 'undefined' && spaceName) ? spaceName : (currentPageParams.get('space') || '');
                    const docIDsAttr = window.escapeHTML(JSON.stringify(docIDs));
                    const textAttr = window.escapeHTML(JSON.stringify(t.text || ''));
                    let fullDesc = t.description || t.text || "";
                    let isLongDesc = fullDesc.length > 150;
                    let shortDesc = isLongDesc ? fullDesc.substring(0, 150) + "..." : fullDesc;

                    let vectorBox = "";
                    if(t.vector && t.vector.length > 0) {
                        let vSize = t.vector_size || 0;
                        let tooltip = `Vector [${Number(t.vector[0]).toFixed(5)},...] size ${vSize}`;
                        vectorBox = `
                            <div title="${tooltip}" style="display: inline-block; font-size: 0.85em; color: var(--text-color); margin-top: 5px; cursor: help; user-select: none;">
                                V[${Number(t.vector[0]).toFixed(5)}...]
                            </div>
                        `;
                    }

                    let displayCatName = (t.category && t.category !== "<nil>") ? t.category : "Uncategorized";
                    let currCatName = (categoryName === 'All Items') ? displayCatName : (categoryName || '');
                    if (window._currentKBCategories) {
                        let catObj = window._currentKBCategories.find(c => c.id === (t.category_id || t.category));
                        if(catObj && catObj.name) {
                            currCatName = catObj.name;
                            displayCatName = catObj.name;
                        }
                    }
                    const docLinkHref = primaryDocID ? window.buildDocViewerURL(primaryDocID, t.text || '') : "";
                    let descHtml = '';
                    if (isLongDesc) {
                        descHtml = `
                            <div class="item-content-wrapper" style="flex: 1; display: flex; flex-direction: column;">
                                <div style="flex: 1;">
                                    <span class="desc-short">${shortDesc}</span>
                                    <span class="desc-full" style="display:none; white-space:pre-wrap;">${window.escapeHTML(fullDesc)}</span>
                                </div>
                                <div style="margin-top: 8px; display: flex; align-items: center; position: relative;">
                                    <a class="read-more-btn" onclick="toggleDomainItemDesc(this)" data-item-id="${window.escapeHTML(t.id || '')}" data-item-category="${window.escapeHTML(t.category_id || t.category || '')}" style="cursor:pointer; color:var(--link-color); font-size:0.85em; text-decoration:underline;">Read More</a>
                                    ${kbIsReadOnly ?

                // Add pagination controls

                const currentPage = Math.floor(offset / limit) + 1;
