name: Deploy site (Cloudflare)

on:
  push:
    branches:
      - master
    paths:
      - 'demo/**'
      - 'demo-agents/**'
      - 'demo-btree/**'
      - 'demo-intent/**'
      - 'intent/**'
      - 'docs/assets/**'
      - 'docs/index.html'
      - 'scripts/assemble-site.sh'
      - 'sop-arena/**'
      - 'deploy/cloudflare/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview uploads a version with its own URL, production deploys it live'
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

# One deploy at a time; never cancel one that is already running.
concurrency:
  group: "site-deploy"
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Build WASM Demo + SOP Arena, Package Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Go Toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Copy Go WebAssembly JavaScript Support (wasm_exec.js)
        shell: bash
        run: |
          set -euo pipefail
          GOROOT="$(go env GOROOT)"
          echo "Locating wasm_exec.js in GOROOT: ${GOROOT}"

          # Support modern Go (lib/wasm) and legacy Go (misc/wasm) locations
          if [ -f "${GOROOT}/lib/wasm/wasm_exec.js" ]; then
            cp "${GOROOT}/lib/wasm/wasm_exec.js" demo/wasm_exec.js
            cp "${GOROOT}/lib/wasm/wasm_exec.js" demo-agents/wasm_exec.js
            cp "${GOROOT}/lib/wasm/wasm_exec.js" demo-btree/wasm_exec.js
            cp "${GOROOT}/lib/wasm/wasm_exec.js" demo-intent/wasm_exec.js
            echo "Copied from ${GOROOT}/lib/wasm/wasm_exec.js"
          elif [ -f "${GOROOT}/misc/wasm/wasm_exec.js" ]; then
            cp "${GOROOT}/misc/wasm/wasm_exec.js" demo/wasm_exec.js
            cp "${GOROOT}/misc/wasm/wasm_exec.js" demo-agents/wasm_exec.js
            cp "${GOROOT}/misc/wasm/wasm_exec.js" demo-btree/wasm_exec.js
            cp "${GOROOT}/misc/wasm/wasm_exec.js" demo-intent/wasm_exec.js
            echo "Copied from ${GOROOT}/misc/wasm/wasm_exec.js"
          else
            echo "Error: wasm_exec.js not found in ${GOROOT}" >&2
            exit 1
          fi

      - name: Compile Go Engine to WebAssembly (sop.wasm)
        shell: bash
        run: |
          set -euo pipefail
          echo "Compiling SOP embedded engine to WebAssembly..."
          cd demo
          # -s -w strips symbol tables and debug information to minimize binary footprint
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o sop.wasm .
          ls -lh sop.wasm wasm_exec.js index.html

      - name: Compile Agent Verification Barrier to WebAssembly (sop-agents.wasm)
        shell: bash
        run: |
          set -euo pipefail
          echo "Compiling verify barrier demo to WebAssembly..."
          cd demo-agents
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o sop-agents.wasm .
          ls -lh sop-agents.wasm wasm_exec.js index.html

      - name: Compile Joltrin Arena B-tree challenge to WebAssembly (arena.wasm)
        shell: bash
        run: |
          set -euo pipefail
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o demo-btree/arena.wasm ./demo-btree/wasm
          ls -lh demo-btree/arena.wasm demo-btree/wasm_exec.js demo-btree/index.html

      - name: Compile Private Intent to WebAssembly (intent.wasm)
        shell: bash
        run: |
          set -euo pipefail
          cd demo-intent
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o intent.wasm .
          ls -lh intent.wasm wasm_exec.js index.html

      - name: Setup Node.js Toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'sop-arena/package-lock.json'

      - name: Install SOP Arena Dependencies
        working-directory: ./sop-arena
        run: npm ci || npm install

      - name: Build SOP Arena
        working-directory: ./sop-arena
        run: npm run build

      - name: Assemble Combined Site
        shell: bash
        run: |
          set -euo pipefail
          # The same script the pull request check runs, so what a PR proves is what ships.
          scripts/assemble-site.sh _site
          ls -lh _site _site/arena _site/agents _site/assets

      - name: Upload the assembled site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build-and-package
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'production' }}
        run: |
          if [ "$MODE" = production ]; then
            npx --yes wrangler@4 deploy
            echo "url=https://joltrinhq.com" >> "$GITHUB_OUTPUT"
          else
            # Wrangler writes a JSON line per event to this file, so the URL is read as a field.
            export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.json"
            npx --yes wrangler@4 versions upload
            url=$(jq -r 'select(.type == "version-upload") | .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | head -1)
            [ -n "$url" ] || { echo "Error: no preview_url in wrangler output" >&2; exit 1; }
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

  verify-live:
    name: Open the live site after the deploy
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install test dependencies and browsers
        timeout-minutes: 20
        run: |
          npm ci
          # The Azure package mirror sometimes stops sending one file and apt then waits for minutes.
          # Short connection timeouts, a four minute cut-off per attempt, and the main Ubuntu archive from the
          # second attempt on. The third attempt puts the runner's own mirror list back.
          sudo cp /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors.txt.orig || true
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99ci-retries >/dev/null
          for attempt in 1 2 3; do
            if [ "$attempt" -ge 2 ]; then
              if [ "$attempt" -eq 2 ]; then
                printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              else
                sudo cp /etc/apt/apt-mirrors.txt.orig /etc/apt/apt-mirrors.txt || true
              fi
              sudo pkill -9 -x apt-get || true
              sudo pkill -9 -x apt || true
              sudo pkill -9 -x dpkg || true
              sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
              sudo dpkg --configure -a || true
              sleep 5
            fi
            if timeout 240 npx playwright install-deps chromium && timeout 300 npx playwright install chromium; then
              exit 0
            fi
            echo "Install attempt $attempt failed or timed out."
          done
          exit 1

      - name: Wait for the live site to answer
        run: |
          for i in $(seq 1 24); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' ${SITE_URL}/)" = 200 ] && exit 0
            sleep 5
          done
          echo "Error: ${SITE_URL}/ did not answer 200 within two minutes" >&2
          exit 1

      - name: Open every page of the live site
        env:
          CI: true
          LIVE_SITE: '1'
          BASE_URL: ${{ needs.deploy.outputs.url }}
        run: npx playwright test tests/site-smoke.spec.ts --project=chromium --project=mobile-chrome

      - name: Check the live YouTube embeds
        run: |
          curl -fsS "${SITE_URL}/" -o /tmp/live-index.html
          mkdir -p /tmp/live && cp /tmp/live-index.html /tmp/live/index.html
          scripts/check-youtube.sh /tmp/live
