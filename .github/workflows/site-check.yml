name: Site Check

# Builds the site the way the Pages deploy does and fails if any file a page
# names (video, poster, image, script) is missing from it. The deploy once
# published a homepage whose video files were never copied, and the local
# tests did not notice because they assemble the site a different way. It then
# opens every page of that assembled site in a browser, with and without the
# third-party hosts, and checks the embedded YouTube videos still play.
# It runs on every pull request, with no path filter, because it is a required
# check and a required check that does not run on a PR blocks that PR for good.
on:
  pull_request:

permissions:
  contents: read

jobs:
  site-assembles:
    name: Site assembles with every referenced file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build the WebAssembly demos
        shell: bash
        run: |
          set -euo pipefail
          GOROOT="$(go env GOROOT)"
          src="${GOROOT}/lib/wasm/wasm_exec.js"
          [ -f "$src" ] || src="${GOROOT}/misc/wasm/wasm_exec.js"
          cp "$src" demo/wasm_exec.js
          cp "$src" demo-agents/wasm_exec.js
          cp "$src" demo-btree/wasm_exec.js
          cp "$src" demo-intent/wasm_exec.js
          (cd demo && GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o sop.wasm .)
          (cd demo-agents && GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o sop-agents.wasm .)
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o demo-btree/arena.wasm ./demo-btree/wasm
          (cd demo-intent && GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o intent.wasm .)

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'sop-arena/package-lock.json'

      - name: Build SOP Arena
        working-directory: ./sop-arena
        run: |
          npm ci || npm install
          npm run build

      - name: Check the page stylesheets are up to date
        run: |
          scripts/build-css.sh
          git diff --exit-code demo/tailwind.css demo-agents/tailwind.css demo-btree/tailwind.css demo-intent/tailwind.css

      - name: Assemble the site and check every referenced file
        run: scripts/assemble-site.sh _site

      - name: Check the embedded YouTube videos still embed
        run: scripts/check-youtube.sh _site

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install test dependencies and browsers
        timeout-minutes: 20
        run: |
          npm ci
          # The Azure package mirror sometimes stops sending one file and apt then waits for minutes.
          # Short connection timeouts, a four minute cut-off per attempt, and the main Ubuntu archive from the
          # second attempt on. The third attempt puts the runner's own mirror list back.
          sudo cp /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors.txt.orig || true
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99ci-retries >/dev/null
          for attempt in 1 2 3; do
            if [ "$attempt" -ge 2 ]; then
              if [ "$attempt" -eq 2 ]; then
                printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              else
                sudo cp /etc/apt/apt-mirrors.txt.orig /etc/apt/apt-mirrors.txt || true
              fi
              sudo pkill -9 -x apt-get || true
              sudo pkill -9 -x apt || true
              sudo pkill -9 -x dpkg || true
              sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
              sudo dpkg --configure -a || true
              sleep 5
            fi
            if timeout 240 npx playwright install-deps chromium && timeout 300 npx playwright install chromium; then
              exit 0
            fi
            echo "Install attempt $attempt failed or timed out."
          done
          exit 1

      - name: Check malformed requests and site path boundaries
        run: npm run test:site-server

      - name: Open every page of the assembled site
        env:
          CI: true
        run: npx playwright test tests/site-smoke.spec.ts --project=chromium --project=mobile-chrome

      - name: Keep the report when the smoke test fails
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-smoke-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
