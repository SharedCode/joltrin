name: Site Check

# Builds the site the way the Pages deploy does and fails if any file a page
# names (video, poster, image, script) is missing from it. The deploy once
# published a homepage whose video files were never copied, and the local
# tests did not notice because they assemble the site a different way. It then
# opens every page of that assembled site in a browser, with and without the
# third-party hosts, and checks the embedded YouTube videos still play.
# It runs on every pull request, with no path filter, because it is a required
# check and a required check that does not run on a PR blocks that PR for good.
on:
  pull_request:

permissions:
  contents: read

jobs:
  site-assembles:
    name: Site assembles with every referenced file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build the WebAssembly demos
        shell: bash
        run: |
          set -euo pipefail
          GOROOT="$(go env GOROOT)"
          src="${GOROOT}/lib/wasm/wasm_exec.js"
          [ -f "$src" ] || src="${GOROOT}/misc/wasm/wasm_exec.js"
          cp "$src" demo/wasm_exec.js
          cp "$src" demo-agents/wasm_exec.js
          (cd demo && GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o sop.wasm .)
          (cd demo-agents && GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o sop-agents.wasm .)

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'sop-arena/package-lock.json'

      - name: Build SOP Arena
        working-directory: ./sop-arena
        run: |
          npm ci || npm install
          npm run build

      - name: Check the page stylesheets are up to date
        run: |
          scripts/build-css.sh
          git diff --exit-code demo/tailwind.css demo-agents/tailwind.css

      - name: Assemble the site and check every referenced file
        run: scripts/assemble-site.sh _site

      - name: Check the embedded YouTube videos still embed
        run: scripts/check-youtube.sh _site

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install test dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Open every page of the assembled site
        env:
          CI: true
        run: npx playwright test tests/site-smoke.spec.ts --project=chromium --project=mobile-chrome

      - name: Keep the report when the smoke test fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: site-smoke-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14
