name: Playwright E2E Test Suite (Joltrin Web & Docs)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'demo/**'
      - 'demo-agents/**'
      - 'demo-btree/**'
      - 'demo-intent/**'
      - 'intent/**'
      - 'sop-arena/**'
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'demo/**'
      - 'demo-agents/**'
      - 'demo-btree/**'
      - 'demo-intent/**'
      - 'intent/**'
      - 'sop-arena/**'
      - 'docs/**'
      - 'tests/**'
      - 'scripts/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: "e2e-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  e2e-matrix:
    name: Run E2E Matrix (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Go Toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Copy Go WebAssembly JavaScript Runtime Support (wasm_exec.js)
        shell: bash
        run: |
          set -euo pipefail
          GOROOT="$(go env GOROOT)"
          if [ -f "${GOROOT}/lib/wasm/wasm_exec.js" ]; then
            cp "${GOROOT}/lib/wasm/wasm_exec.js" demo/wasm_exec.js
            cp "${GOROOT}/lib/wasm/wasm_exec.js" demo-agents/wasm_exec.js
            cp "${GOROOT}/lib/wasm/wasm_exec.js" demo-btree/wasm_exec.js
            cp "${GOROOT}/lib/wasm/wasm_exec.js" demo-intent/wasm_exec.js
          elif [ -f "${GOROOT}/misc/wasm/wasm_exec.js" ]; then
            cp "${GOROOT}/misc/wasm/wasm_exec.js" demo/wasm_exec.js
            cp "${GOROOT}/misc/wasm/wasm_exec.js" demo-agents/wasm_exec.js
            cp "${GOROOT}/misc/wasm/wasm_exec.js" demo-btree/wasm_exec.js
            cp "${GOROOT}/misc/wasm/wasm_exec.js" demo-intent/wasm_exec.js
          else
            echo "Error: wasm_exec.js not found in ${GOROOT}" >&2
            exit 1
          fi

      - name: Compile Go Engines to WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          echo "Compiling demo/sop.wasm..."
          (cd demo && GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o sop.wasm .)
          echo "Compiling demo-agents/sop-agents.wasm..."
          (cd demo-agents && GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o sop-agents.wasm .)
          echo "Compiling demo-btree/arena.wasm..."
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o demo-btree/arena.wasm ./demo-btree/wasm
          echo "Compiling demo-intent/intent.wasm..."
          (cd demo-intent && GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o intent.wasm .)

      - name: Setup Node.js Toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install & Build Joltrin Arena
        working-directory: ./sop-arena
        run: |
          npm ci || npm install
          npm run build

      - name: Assemble Combined Site
        shell: bash
        run: bash scripts/build-site.sh

      - name: Cache Playwright Browser Binaries
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The Azure package mirror sometimes stops sending one file, and apt then waits for minutes.
      # Install system packages only for the browser this job uses (a fraction of the download), cut each
      # attempt off after four minutes, and move to the main Ubuntu archive from the second attempt on.
      - name: Install Playwright Browsers & OS Dependencies
        timeout-minutes: 20
        env:
          PROJECT: ${{ matrix.project }}
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          case "$PROJECT" in
            firefox) engine=firefox ;;
            webkit|mobile-safari) engine=webkit ;;
            *) engine=chromium ;;
          esac
          sudo cp /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors.txt.orig || true
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99ci-retries >/dev/null
          for attempt in 1 2 3; do
            if [ "$attempt" -ge 2 ]; then
              # Attempt 2 uses the main archive. Attempt 3 goes back to the runner's own mirror list, so a
              # bad fallback can never be the only thing left. apt wants a tab before the priority.
              if [ "$attempt" -eq 2 ]; then
                printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
              else
                sudo cp /etc/apt/apt-mirrors.txt.orig /etc/apt/apt-mirrors.txt || true
              fi
              sudo pkill -9 -x apt-get || true
              sudo pkill -9 -x apt || true
              sudo pkill -9 -x dpkg || true
              sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
              sudo dpkg --configure -a || true
              sleep 5
            fi
            # install-deps adds system packages only. Plain "playwright install" downloads browser binaries
            # only (system packages need --with-deps), so the two steps do not repeat each other.
            if timeout 240 npx playwright install-deps "$engine" && { [ "$CACHE_HIT" = "true" ] || timeout 300 npx playwright install; }; then
              exit 0
            fi
            echo "Install attempt $attempt failed or timed out."
          done
          exit 1

      - name: Execute Playwright E2E Tests
        env:
          CI: true
          PORT: 4173
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright Test Report Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Failure Traces & Screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 14
