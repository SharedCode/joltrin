name: Gemini PR Review

# Sets the "Gemini Review" commit status on the PR head commit. Branch
# protection requires that status, so a PR cannot merge until Gemini has
# passed the exact commit being merged.
#
# pull_request_target runs this file from the base branch and never checks
# out or executes pull request code, which keeps GEMINI_API_KEY away from
# fork code. The PR diff is fetched through the API and sent to Gemini as
# data only.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "master" ]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
      model:
        description: "Gemini model to use"
        required: false
        default: "gemini-2.5-flash"

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: gemini-pr-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  gemini-review-run:
    # Drafts are skipped and stay without a status, so they cannot merge.
    # issue_comment: PR comments from the owner, members, or collaborators
    # containing the trigger phrase, so outside users cannot spend the quota.
    if: >
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, '/gemini review') || contains(github.event.comment.body, '@gemini review'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Base branch only. Do not add a ref: here.
      - name: Checkout base branch
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ai/go.mod

      # A missing key is not skipped: the reviewer sets a failing Gemini
      # Review status and exits non-zero, so the PR stays blocked.
      - name: Run Gemini PR review gate
        working-directory: ai
        timeout-minutes: 12
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_MODEL: ${{ github.event.inputs.model || 'gemini-2.5-flash' }}
          GEMINI_TIMEOUT: 90s
        run: go run ./cmd/pr-reviewer

  # A job that is cancelled, times out, or dies before the reviewer can write
  # a status leaves the commit with a stale pending or missing status. Mark
  # it failed so the block is explicit rather than an indefinite wait.
  gemini-review-failsafe:
    needs: gemini-review-run
    if: ${{ always() && needs.gemini-review-run.result != 'success' && needs.gemini-review-run.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark Gemini Review failed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
        run: |
          sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          gh api "repos/$REPO/statuses/$sha" -f state=failure -f context="Gemini Review" \
            -f description="Gemini review did not complete"
