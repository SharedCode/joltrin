name: Release Joltrin Engine

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes (overrides auto-generation)'
        required: false
        default: 'Manual Rebuild / Maintenance Release'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  qa-gate:
    name: QA Gate (vet + unit + race)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # `demo` and `demo-agents` only compile under GOOS=js GOARCH=wasm
      # (they import syscall/js); excluded here the same way ci.yml and
      # go.yml already exclude them, see the comment there.
      - name: go vet
        shell: bash
        run: |
          set -euo pipefail
          exclude='/demo$|/demo-agents$'
          go vet $(go list ./... 2>/dev/null | grep -Ev "$exclude")

      - name: Build all packages
        shell: bash
        run: |
          set -euo pipefail
          exclude='/demo$|/demo-agents$'
          go build $(go list ./... 2>/dev/null | grep -Ev "$exclude")

      - name: Unit tests with race detector
        env:
          datapath: ${{ github.workspace }}/.sop_data
        run: |
          set -euo pipefail
          mkdir -p "$datapath"
          go test -timeout 30m -race -count=1 ./inmemory ./btree ./common ./infs

  build-macos:
    name: Build Native (macOS)
    needs: qa-gate
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build macOS binaries
        run: |
          chmod +x scripts/build_release.sh
          # Only build macos parts
          export ONLY_MACOS=1
          export SOP_VERSION=${{ github.ref_name }}
          ./scripts/build_release.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libs-macos
          path: |
            bindings/python/sop/*.dylib
            bindings/python/sop/*.h
            bindings/csharp/Sop/*.dylib
            bindings/csharp/Sop/*.h
            bindings/java/src/main/resources/darwin-*/*.dylib
            release/model_catalog.json
            release/sop-httpserver-darwin-*
            release/sop-bundle-darwin-*.tar.gz

  build-linux-windows:
    name: Build Native (Linux & Windows)
    needs: qa-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Cross-Compilation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 zip

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build Linux and Windows binaries
        run: |
          chmod +x scripts/build_release.sh
          # Skip macos parts (built in separate job)
          export SKIP_MACOS=1
          export SOP_VERSION=${{ github.ref_name }}
          ./scripts/build_release.sh

      - name: Upload Linux/Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libs-linux-win
          path: |
            bindings/python/sop/*.so
            bindings/python/sop/*.dll
            bindings/python/sop/*.h
            bindings/csharp/Sop/*.so
            bindings/csharp/Sop/*.dll
            bindings/csharp/Sop/*.h
            bindings/java/src/main/resources/linux-*/*.so
            bindings/java/src/main/resources/win32-*/*.dll
            release/model_catalog.json
            release/sop-httpserver-linux-*
            release/sop-httpserver-windows-*
            release/sop-bundle-linux-*.tar.gz
            release/sop-bundle-windows-*.zip

  package-and-release:
    name: Package and Release
    needs: [build-macos, build-linux-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: libs-macos
          # Default path is current working directory, preserving structure

      - name: Download Linux/Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: libs-linux-win

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Package Python Wheel
        run: |
          cd bindings/python
          pip install build wheel
          python3 -m build
          # Ensure release dir exists
          mkdir -p ../../release
          cp dist/*.whl ../../release/
          cd ../..

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Package C# NuGet
        run: |
          cd bindings/csharp/Sop
          sed -i 's/<Version>1.0.0<\/Version>/<Version>${{ github.ref_name }}<\/Version>/' Sop.csproj
          mkdir -p ../../../release
          dotnet pack -c Release -o ../../../release/
          cd ../../..

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Package Java JAR
        run: |
          cd bindings/java
          mvn versions:set -DnewVersion=${{ github.ref_name }}
          mvn package -DskipTests
          mkdir -p ../../release
          cp target/*.jar ../../release/
          cd ../..

      - name: Generate Cryptographic Checksums (SHA-256)
        shell: bash
        run: |
          set -euo pipefail
          cd release
          # Generate SHA256SUMS for all release artifacts
          if command -v sha256sum &> /dev/null; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          cp SHA256SUMS checksums.txt
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Generate Software Bill of Materials (SPDX SBOM)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: 'spdx-json'
          output-file: 'release/sbom.spdx.json'
        continue-on-error: true

      - name: Pre-Publish Release Verification Gate
        shell: bash
        run: |
          chmod +x scripts/verify_release.sh
          ./scripts/verify_release.sh release/

      - name: Attest Build Provenance (SLSA Level 3)
        uses: actions/attest-build-provenance@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          subject-path: 'release/*'
        continue-on-error: true

      - name: Attest SBOM
        uses: actions/attest-sbom@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          subject-path: 'release/*'
          sbom-path: 'release/sbom.spdx.json'
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release/*
          body: ${{ inputs.release_notes }}
          draft: false
          prerelease: false
          generate_release_notes: ${{ inputs.release_notes == '' }}
