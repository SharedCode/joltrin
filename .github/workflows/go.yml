# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master"]
  pull_request:
    branches: [ "master"]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./inmemory ./infs ./btree ./common ./fs ./incfs

      - name: Unit tests with coverage
        run: go test -timeout 600s -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./btree/...,./inmemory/...,./fs/...,./common ./inmemory ./btree ./common ./fs

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: SharedCode/sop

  perf:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run benchmarks
        run: go test -run '^$' -bench . -benchmem -benchtime 50x ./cache ./ai/vector | tee bench.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.run_id }}
          path: bench.txt

  vulncheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # demo and demo-agents are excluded here for the same reason ci.yml
      # excludes them from vet/build/test: they're WASM-only (import
      # syscall/js) and only compile under GOOS=js GOARCH=wasm, so they're
      # scanned separately below.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck $(go list ./... 2>/dev/null | grep -Ev '/demo$|/demo-agents$')

      - name: govulncheck (wasm demo)
        env:
          GOOS: js
          GOARCH: wasm
        run: govulncheck ./demo/...

      - name: govulncheck (wasm agent barrier demo)
        env:
          GOOS: js
          GOARCH: wasm
        run: govulncheck ./demo-agents/...

  stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Wait for Redis
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for Redis..."
          for i in {1..60}; do
            (echo > /dev/tcp/127.0.0.1/6379) && break || sleep 2
          done
          echo "Redis reachable."

      - name: Prepare datapath
        shell: bash
        env:
          datapath: ${{ github.workspace }}/.sop_data
        run: |
          set -euo pipefail
          mkdir -p "$datapath"
          echo "datapath prepared at: $datapath"

      - name: Run stress test suite
        env:
          datapath: ${{ github.workspace }}/.sop_data
        run: |
          go test -timeout 2h -tags=stress ./infs/stresstests

  stress-replication-only:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Wait for Redis
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for Redis..."
          for i in {1..60}; do
            (echo > /dev/tcp/127.0.0.1/6379) && break || sleep 2
          done
          echo "Redis reachable."

      - name: Prepare datapath
        shell: bash
        env:
          datapath: ${{ github.workspace }}/.sop_data
        run: |
          set -euo pipefail
          mkdir -p "$datapath"
          echo "datapath prepared at: $datapath"

      - name: Run replication stress only
        env:
          datapath: ${{ github.workspace }}/.sop_data
        run: |
          go test -timeout 2h -tags=stress ./infs/stresstests/replication -run Reinstate_MultiTable_Concurrency_SecondFailover -count=1
