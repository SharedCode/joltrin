apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: joltrin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SharedCode/joltrin.git
    targetRevision: master
    path: deploy/aks/k8s/overlays/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: joltrin-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
