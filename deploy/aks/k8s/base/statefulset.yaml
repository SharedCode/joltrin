# The embedded B-Tree engine does not support several processes writing one data
# path, so this stays at one replica on a persistent volume. See infra/azure/README.md.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: joltrin
spec:
  serviceName: joltrin
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: joltrin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: joltrin
    spec:
      serviceAccountName: joltrin
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: joltrin
          image: ghcr.io/sharedcode/joltrin
          args: ["-database", "/var/lib/sop", "-port", "8080", "-open-browser=false"]
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/sop
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
